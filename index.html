let AC = null;
function audio(){
  if(!S.sound) return null;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    return AC;
  }catch(e){ return null; }
}
function tone(freq, ms, gain){
  const ac = audio(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, ac.currentTime);
  g.gain.linearRampToValueAtTime(gain||0.25, ac.currentTime+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+ms/1000);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + ms/1000 + 0.03);
}
function noiseBuf(ac){
  if(ac._noise) return ac._noise;
  const n = Math.floor(ac.sampleRate*0.05);
  const b = ac.createBuffer(1,n,ac.sampleRate);
  const d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
  ac._noise = b; return b;
}
// A real clock tick is a transient, not a tone — short bandpassed noise gets it.
function clickTick(high){
  const ac = audio(); if(!ac) return;
  const src = ac.createBufferSource(); src.buffer = noiseBuf(ac);
  const bp = ac.createBiquadFilter(); bp.type="bandpass";
  bp.frequency.value = high ? 2700 : 1850; bp.Q.value = 7;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, ac.currentTime);
  g.gain.linearRampToValueAtTime(0.55, ac.currentTime+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+0.05);
  src.connect(bp); bp.connect(g); g.connect(ac.destination);
  src.start(); src.stop(ac.currentTime+0.07);
}
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
const CUE = {
  count:  ()=>{ tone(660,90,0.18); buzz(35); },
  go:     ()=>{ tone(880,420,0.34); buzz([0,130]); },
  release:()=>{ tone(430,520,0.30); buzz([0,90,60,90]); },
  rest:   ()=>{ tone(320,220,0.18); },
  done:   ()=>{ tone(660,140,0.26); setTimeout(()=>tone(880,340,0.30),170); buzz([0,110,70,190]); },
  tick:   (hi)=>{ clickTick(hi); buzz(26); }
};

let wake = null;
async function wakeOn(){
  if(!S.keepAwake) return;
  try{ if("wakeLock" in navigator && !wake) wake = await navigator.wakeLock.request("screen"); }catch(e){}
}
function wakeOff(){ try{ if(wake){ wake.release(); wake=null; } }catch(e){} }

const T = {on:false, phase:null, i:0, endsAt:0, dur:0, paused:false, left:0, tick:null, lastBeep:-1, ready:null, closing:false};

document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible" && T.on) wakeOn();
});

function ctxRows(){
  const p = currentPlan();
  if(!p.def) return {rows:[], def:null, date:null};
  return {rows: rowsFor(p.def, p.mult), def:p.def, date:p.date};
}
function phaseDur(row, phase){
  if(phase==="prep") return Math.max(0, Number(S.prep)||0)*1000;
  if(phase==="hold") return ((row && row.hold) || 8)*1000;
  return ((row && row.restSec) || 60)*1000;
}
function startPhase(i, phase){
  const c = ctxRows();
  if(!c.def) return;
  if(i >= c.rows.length){ finishStack(); return; }
  if(phase==="prep" && phaseDur(c.rows[i],"prep") <= 0) phase = "hold";
  T.on=true; T.i=i; T.phase=phase; T.paused=false; T.lastBeep=-1; T.ready=null;
  setClosing(false);
  T.dur = phaseDur(c.rows[i], phase);
  T.endsAt = performance.now() + T.dur;
  if(phase==="hold") CUE.go(); else if(phase==="rest") CUE.rest();
  document.body.classList.add("timing");
  $("tover").classList.add("up");
  $("t-pause").textContent = "Pause"; $("t-pause").classList.remove("pause");
  wakeOn();
  if(!T.tick) T.tick = setInterval(tickTimer, 100);
  paintStack(); paintTimer();
}
function stopTimer(){
  T.on=false; T.phase=null; T.paused=false;
  setClosing(false);
  clearInterval(T.tick); T.tick=null;
  document.body.classList.remove("timing");
  $("tover").classList.remove("up");
  wakeOff();
  paintStack();
}
function finishStack(){
  stopTimer(); CUE.done();
  toast("Sets done — now log the session");
}
function setClosing(on){
  if(on === T.closing) return;
  T.closing = on;
  $("tover").classList.toggle("closing", on);
}
function tickTimer(){
  if(!T.on || T.paused) return;
  const left = T.endsAt - performance.now();
  if(left <= 0){ advance(); return; }
  const secs = Math.ceil(left/1000);
  if(T.phase==="rest"){
    // last five seconds: red, pulsing, ticking clock
    setClosing(left <= 5000);
    if(secs<=5 && secs>0 && secs!==T.lastBeep){ T.lastBeep=secs; CUE.tick(secs%2===1); }
  } else {
    if(secs<=3 && secs>0 && secs!==T.lastBeep){ T.lastBeep=secs; CUE.count(); }
  }
  paintTimer(left);
}
function advance(){
  const c = ctxRows();
  if(!c.def){ stopTimer(); return; }
  if(T.phase==="prep"){ startPhase(T.i, "hold"); return; }
  if(T.phase==="hold"){
    CUE.release();
    const d = S.drafts[draftKey(c.date)] || (S.drafts[draftKey(c.date)]=[]);
    d[T.i] = true; save();
    if(T.i+1 >= c.rows.length){ finishStack(); return; }
    startPhase(T.i, "rest"); return;
  }
  if(S.autoAdvance){ startPhase(T.i+1, "prep"); return; }
  T.ready = T.i+1;
  stopTimer();
  CUE.go();
  toast("Rest done — tap your next set");
  focusNext();
}
function mmss(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  const m = Math.floor(s/60);
  return m>0 ? m+":"+String(s%60).padStart(2,"0") : String(s);
}
function paintTimer(leftMs){
  if(!T.on) return;
  const bar = $("tover");
  const left = leftMs!=null ? leftMs : (T.paused ? T.left : T.endsAt-performance.now());
  const c = ctxRows();
  const def = c.def || {};
  const resting = (T.phase==="rest");
  // while resting, everything above the clock describes the set you're about to do
  const row = c.rows[resting ? T.i+1 : T.i] || {};

  bar.classList.remove("rest","prep");
  let label;
  if(T.phase==="prep"){ bar.classList.add("prep"); label="Get set"; }
  else if(T.phase==="hold"){ label="Hold"; }
  else { bar.classList.add("rest"); label="Rest"; }

  const hand = row.hand==="L" ? "Left hand" : row.hand==="R" ? "Right hand" : "Both hands";
  $("tsession").textContent = ((def.blocks||[]).length > 1 && row.blockLabel)
    ? (def.name||"") + " · " + row.blockLabel : (def.name || "");
  $("tset").innerHTML = (resting ? '<em>Next — </em>' : '') + "Set " + (row.n||1) + ": " + hand;
  $("tload").innerHTML = (row.load!=null ? row.load : "—") + (row.noUnit ? "" : ' <small>'+unit()+'</small>');
  $("tedge").textContent = (row.edge||"") + " · " + (row.grip||"").toLowerCase();
  $("tphase").textContent = T.paused ? label+" · paused" : label;
  $("tnum").textContent = mmss(left);
  $("t-auto").setAttribute("aria-checked", String(!!S.autoAdvance));

  const pct = Math.max(0, Math.min(100, (1 - left/T.dur)*100));
  $("tfill").style.width = pct+"%";
  const af = document.querySelector('#stack .set[data-i="'+T.i+'"] .fill');
  if(af) af.style.width = pct+"%";
}
function paintStack(){
  const stack = $("stack"); if(!stack) return;
  const c = ctxRows();
  const draft = (c.date && S.drafts[draftKey(c.date)]) || [];
  stack.querySelectorAll(".set").forEach(el=>{
    const i = +el.dataset.i;
    el.dataset.on = draft[i] ? "true" : "false";
    const active = T.on && i===T.i;
    el.classList.toggle("active", active);
    el.classList.toggle("resting", active && T.phase==="rest");
    el.classList.toggle("next", !T.on && T.ready===i && !draft[i]);
    const f = el.querySelector(".fill");
    if(f && !active) f.style.width = "0";
  });
}
function focusNext(){
  if(T.ready==null) return;
  const el = document.querySelector('#stack .set[data-i="'+T.ready+'"]');
  if(el) el.scrollIntoView({block:"center", behavior:"smooth"});
}
function setAuto(v){
  S.autoAdvance = !!v; save();
  ["btn-auto","t-auto"].forEach(id=>{
    const el = $(id); if(el) el.setAttribute("aria-checked", String(S.autoAdvance));
  });
  toast(S.autoAdvance ? "Auto — sets chain by themselves" : "Manual — tap each set");
}
function wireTimer(){
  $("t-auto").onclick = ()=> setAuto(!S.autoAdvance);
  $("t-pause").onclick = ()=>{
    if(!T.on) return;
    if(T.paused){ T.endsAt = performance.now()+T.left; T.paused=false;
                  $("t-pause").textContent="Pause"; $("t-pause").classList.remove("pause"); }
    else { T.left = T.endsAt - performance.now(); T.paused=true;
           $("t-pause").textContent="Resume"; $("t-pause").classList.add("pause"); }
    paintTimer();
  };
  $("t-skip").onclick  = ()=>{ if(T.on) advance(); };
  $("t-add").onclick   = ()=>{ if(!T.on) return; T.endsAt += 30000; T.dur += 30000; paintTimer(); };
  $("t-stop").onclick  = ()=>{ stopTimer(); };
}

function renderRail(){
  const done = doneCount();
  const missCount = Object.values(EN()).filter(e=>e.status==="missed").length;

  // Five vertical topo lines up the wall — one per program slot. Only the
  // slot holding the active program draws real, tappable stations; the rest
  // are gray 20-point placeholders waiting for a future program to claim
  // them, left to right.
  const LANES = 5, PLACEHOLDER_N = 20;
  const N = SESSIONS.length;
  const VBW = 300, VBH = 260;
  const marginX = 26, topY = 10, botY = VBH - 10;
  const summitX = VBW / 2;
  const converge = 0.46;
  const laneX = i => marginX + i * (VBW - marginX*2) / (LANES - 1);

  // Deterministic pseudo-random — same shape every render, distinct per lane,
  // reads as a hand-drawn topo line rather than a clean sine wave. Jitter
  // eases to zero at both ends so the start/end anchors sit exactly on line.
  function noise(n){ const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); }
  function lanePts(i, count, amp, seed){
    const bx = laneX(i), tx = bx + (summitX - bx) * converge;
    const pts = [];
    for(let k=0; k<count; k++){
      const t = count > 1 ? k/(count-1) : 0;
      const y = botY - t * (botY - topY);
      const base = bx + (tx - bx) * t;
      const ease = Math.sin(t * Math.PI);
      const jitter = (noise(seed + k*3.71) - 0.5) * 2 * amp * ease
                   + (noise(seed*1.9 + k*1.13) - 0.5) * amp * 0.5 * ease;
      pts.push([base + jitter, y]);
    }
    return pts;
  }
  function pathD(pts){
    let d = "M"+pts[0][0].toFixed(1)+" "+pts[0][1].toFixed(1);
    for(let k=0; k<pts.length-1; k++){
      const a=pts[k], b=pts[k+1], cy=((a[1]+b[1])/2).toFixed(1);
      d += " C"+a[0].toFixed(1)+" "+cy+","+b[0].toFixed(1)+" "+cy+","+b[0].toFixed(1)+" "+b[1].toFixed(1);
    }
    return d;
  }
  function diamond(x,y,r,fill,stroke){
    return '<rect x="'+(x-r).toFixed(1)+'" y="'+(y-r).toFixed(1)+'" width="'+(r*2).toFixed(1)+'" height="'+(r*2).toFixed(1)+'" '
         + 'transform="rotate(45 '+x.toFixed(1)+' '+y.toFixed(1)+')" '
         + 'fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.4"/>';
  }

  let svg = "";

  for(let i=1; i<LANES; i++){
    const pts = lanePts(i, PLACEHOLDER_N, 11, i*911.7);
    svg += '<path d="'+pathD(pts)+'" fill="none" stroke="rgba(255,255,255,.20)" '
         + 'stroke-width="1.2" stroke-dasharray="1.3 4.6" stroke-linecap="round"/>';
    pts.forEach(([x,y])=>{
      svg += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2" '
           + 'fill="rgba(255,255,255,.09)" stroke="rgba(255,255,255,.24)" stroke-width="1"/>';
    });
  }

  const sched = sessionSchedule();
  const pts = lanePts(0, N, 13, 42.3);
  lastActivePts = pts;
  svg += '<path d="'+pathD(pts)+'" fill="none" stroke="rgba(255,255,255,.62)" stroke-width="1.7" '
       + 'stroke-dasharray="1.5 5.5" stroke-linecap="round"/>';
  let dots = "";
  const activeSel = activeIdx();
  pts.forEach((p,i)=>{
    const x = p[0].toFixed(1), y = p[1].toFixed(1);
    const isStart = (i === 0), isEnd = (i === N-1);
    const isAnchor = !isStart && !isEnd && PHASES.some(ph=>ph.from===i);
    let mark, r;

    if(isStart){
      r = 6.4; mark = '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="var(--anchor-a)" stroke="#fff" stroke-width="1.3"/>';
    } else if(isEnd){
      r = 6.4; mark = '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="var(--anchor-b)" stroke="#fff" stroke-width="1.3"/>';
    } else {
      let fill, stroke, ringR = null;
      if(i < done){
        fill = "rgba(143,170,131,.42)"; stroke = "rgba(143,170,131,.55)";
      } else if(i === done){
        fill = "var(--red)"; stroke = "#fff"; ringR = 7.2;
      } else {
        fill = "rgba(255,255,255,.16)"; stroke = "rgba(255,255,255,.5)";
      }
      r = isAnchor ? 4.6 : 3.4;
      if(ringR){
        mark = '<circle cx="'+x+'" cy="'+y+'" r="'+ringR+'" fill="none" stroke="var(--red)" stroke-width="2"/>'
             + (isAnchor ? diamond(p[0],p[1],3,"var(--red)","#fff") : '<circle cx="'+x+'" cy="'+y+'" r="2.6" fill="var(--red)"/>');
      } else {
        mark = isAnchor ? diamond(p[0],p[1],r,fill,stroke)
                         : '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.2"/>';
      }
    }
    const sel = (activeSel===i)
      ? '<circle cx="'+x+'" cy="'+y+'" r="'+(r+4).toFixed(1)+'" fill="none" stroke="#fff" stroke-width="1.4"/>' : '';
    const sc = sched[i] || {};
    dots += '<g class="stn" data-i="'+i+'">'
          +   '<title>Session '+(i+1)+' — '+SESSIONS[i].name
          +   (sc.date ? ' · '+pretty(sc.date) : '')+'</title>'
          +   '<circle cx="'+x+'" cy="'+y+'" r="11" fill="transparent"/>'
          +   mark + sel
          + '</g>';
  });
  svg += dots;

  $("rail").innerHTML =
    '<svg viewBox="0 0 '+VBW+' '+VBH+'" aria-hidden="true">' + svg + '</svg>';
  $("count").textContent = Math.min(done+1,SESSIONS.length)+" / "+SESSIONS.length +
    (missCount ? "  ·  "+missCount+" skipped" : "");
  $("rail").querySelectorAll("g.stn").forEach(g=>{
    g.onclick = (e)=>{
      const i = resolveTapIndex(e, +g.dataset.i);
      selStation = (selStation===i) ? null : i;
      renderRail();
      if(tab==="programs"){ openAcc["prog:today"] = true; renderProgramsBody(); }
    };
  });
}

// Adjacent route stations sit closer together than a comfortable tap target,
// so their invisible hit-circles overlap — the browser's native hit-test
// reliably resolves to whichever one happens to paint on top, not whichever
// is actually under the finger. Whichever node's handler fires, recompute
// the real nearest station from the tap's own coordinates in the SVG's
// coordinate space, and trust that instead. Falls back to the DOM-hit
// element's own index if the browser doesn\'t support the geometry calls
// (only relevant to non-browser test environments — every real browser does).
function resolveTapIndex(e, fallbackI){
  const svg = $("rail").querySelector("svg");
  if(svg && typeof svg.createSVGPoint === "function" && svg.getScreenCTM){
    try{
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const ctm = svg.getScreenCTM();
      if(ctm && lastActivePts.length){
        const p = pt.matrixTransform(ctm.inverse());
        let best = null, bestD = Infinity;
        lastActivePts.forEach((sp,i)=>{
          const d = (sp[0]-p.x)*(sp[0]-p.x) + (sp[1]-p.y)*(sp[1]-p.y);
          if(d < bestD){ bestD = d; best = i; }
        });
        if(best!=null) return best;
      }
    }catch(err){ /* fall through */ }
  }
  return fallbackI;
}

function sessionSchedule(){
  const out = new Array(SESSIONS.length).fill(null);
  let i = 0;
  Object.keys(EN()).sort().forEach(d=>{
    const e = EN()[d];
    if(e.status==="done" && e.advances!==false){
      if(i < out.length) out[i] = {date:d, status:"done", entry:e};
      i++;
    }
  });
  const free = slots(200).filter(d=>!EN()[d]);
  let k = 0;
  for(let j=i;j<out.length;j++){
    out[j] = {date: free[k++]||null, status:(j===i ? "current" : "upcoming")};
  }
  return out;
}

function renderStation(){
  const box = $("railinfo");
  if(!box) return;
  if(selStation==null || !SESSIONS[selStation]){ box.innerHTML=""; box.className="railinfo"; return; }
  const i = selStation, def = SESSIONS[i], ph = phaseOf(i);
  const sc = sessionSchedule()[i] || {};

  let status;
  if(sc.status==="done"){
    const e = sc.entry || {}, bits = [];
    if(e.loads && (e.loads.L!=null || e.loads.R!=null))
      bits.push("L "+fmt(e.loads.L)+" / R "+fmt(e.loads.R)+" "+unit());
    if(e.rpe) bits.push("RPE "+e.rpe);
    status = "Logged "+pretty(sc.date)+(bits.length ? " · "+bits.join(" · ") : "");
  } else if(sc.status==="current"){
    status = "Up next · "+(sc.date ? pretty(sc.date) : "unscheduled");
  } else {
    status = "Planned · "+(sc.date ? pretty(sc.date) : "—");
  }
  box.className = "railinfo on"+(sc.status==="done" ? " done" : "");
  box.innerHTML =
      '<button class="stn-x" id="stn-close" aria-label="Close">×</button>'
    + '<div class="stn-n">Session '+(i+1)+' · Phase '+ph.n+' · '+ph.label+'</div>'
    + '<div class="stn-t">'+def.name+'</div>'
    + (def.blocks||[]).map(b=>'<div class="stn-s">'+blockLine(b)+'</div>').join("")
    + '<div class="stn-st">'+status+'</div>'
    + ((sc.status==="done" && sc.entry && sc.entry.notes)
        ? '<div class="stn-note">'+esc(sc.entry.notes)+'</div>' : '');
  $("stn-close").onclick = ()=>{ selStation=null; renderRail(); };

// Each row carries everything the timer needs, so a session can mix a heavy block
// with a density finisher and the clock adapts per row.
function rowsFor(def, mult){
  const rows = [];
  (def.blocks||[]).forEach((b, bi)=>{
    const lo = blockLoads(b, mult);
    const two = (b.mode === "hang");
    for(let i=0;i<b.sets;i++){
      const base = {hold:b.hold, restSec:b.restSec, edge:b.edge, grip:b.grip, mode:b.mode,
                    blockIdx:bi, blockLabel:b.label, sub:lo?lo.sub:null,
                    noUnit:!!(lo && lo.rpe)};
      if(two){
        rows.push(Object.assign({n:i+1, lbl:"Set "+(i+1), hand:"", load:lo?lo.L:"—"}, base));
      }else{
        rows.push(Object.assign({n:i+1, lbl:"Set "+(i+1), hand:"L", load:lo?lo.L:"—"}, base));
        rows.push(Object.assign({n:i+1, lbl:"",           hand:"R", load:lo?lo.R:"—"}, base));
      }
    }
  });
  return rows;
}
function blockRows(b){ return (b.mode==="hang") ? b.sets : b.sets*2; }
function estMin(def){
  const prep = Math.max(0, Number(S.prep)||0);
  let secs = 0;
  (def.blocks||[]).forEach((b,i)=>{
    const n = blockRows(b);
    secs += n*(b.hold + prep) + (n-1)*b.restSec;
    if(i>0) secs += b.restSec;               // gap between blocks
  });
  return Math.max(1, Math.round(secs/60));
}
function restLabel(sec){
  const r = sec || 60;
  if(r >= 90){ const m = r/60; return (m % 1 ? m.toFixed(1) : m) + " min"; }
  return r + "s";
}
function pctLabel(b){
  const L = b.load;
  if(!L) return "test";
  if(L.rpe) return "RPE "+L.rpe;
  return Math.round(L.pct*100)+"%";
}
function blockLine(b){
  return b.edge+" · "+b.sets+(b.mode==="hang" ? " sets" : " / hand")
       + " × "+b.hold+"s · "+pctLabel(b);
}
function specLine(def){
  const b = (def.blocks||[])[0] || {};
  const cells = [
    ["Edge",  b.edge || "—"],
    ["Grip",  b.mode==="hang" ? "Half crimp <small>2 arms</small>" : (b.grip||"—")],
    ["Hold",  (b.hold||0) + "s"],
    ["Sets",  b.mode==="hang" ? b.sets + " <small>total</small>"
                              : b.sets + " <small>/ hand</small>"],
    ["Rest",  restLabel(b.restSec)],
    ["Time",  "≈" + estMin(def) + " <small>min</small>"]
  ];
  let h = '<div class="specs">' + cells.map(c=>
    '<div><div class="k">'+c[0]+'</div><div class="v">'+c[1]+'</div></div>').join("") + '</div>';
  (def.blocks||[]).slice(1).forEach(x=>{
    h += '<div class="addon"><b>+ '+x.label+'</b> '+blockLine(x)+'</div>';
  });
  return h;
}
function renderStack(def, mult, date){
  const draft = S.drafts[draftKey(date)] || [];
  const rows = rowsFor(def, mult);
  const multi = (def.blocks||[]).length > 1;
  let h='<div class="startbar">'
    + '<button class="btn primary" id="btn-start">Start timer</button>'
    + '<button class="sw" id="btn-auto" role="switch" aria-checked="'+(S.autoAdvance?"true":"false")+'">'
    +   '<span class="track"><i></i></span><span>Auto</span>'
    + '</button>'
    + '</div>';
  h+='<div class="stack" id="stack">';
  let seen = -1;
  rows.forEach((r,i)=>{
    if(multi && r.blockIdx !== seen){
      seen = r.blockIdx;
      const b = def.blocks[r.blockIdx];
      h += '<div class="blockhead">'+b.label+'<span>'+blockLine(b)+'</span></div>';
    }
    const u = r.noUnit ? "" : ' <small>'+unit()+'</small>';
    h += '<div class="set" data-i="'+i+'" data-on="'+(draft[i]?"true":"false")+'">'
       +   '<i class="fill"></i>'
       +   '<button class="set-body" data-i="'+i+'" aria-label="Start from '+(r.lbl||"set")+' '+r.hand+'">'
       +     '<span class="lbl">'+r.lbl+'</span>'
       +     '<span class="hand">'+r.hand+'</span>'
       +     '<span class="load">'+r.load+u+'</span>'
       +   '</button>'
       +   '<button class="tick" data-i="'+i+'" aria-label="Mark set done">✓</button>'
       + '</div>';
  });
  h+='</div>';
  const b0 = (def.blocks||[])[0] || {};
  const restTxt = (b0.mode==="hang" ? restLabel(b0.restSec)+" between sets"
                                    : "Alternate hands · "+restLabel(b0.restSec)+" between hands");
  h+='<div class="rest-note" style="display:flex;justify-content:space-between;align-items:center;gap:10px">'
    + '<span>'+restTxt+' · tap a row to start there</span>'
    + '<button id="btn-clear" style="background:none;border:0;padding:0;color:var(--pencil);font:inherit;'
    + 'cursor:pointer;text-decoration:underline;text-underline-offset:3px;white-space:nowrap">Clear</button>'
    + '</div>';
  const subs = [...new Set(rows.map(r=>r.sub).filter(Boolean))];
  subs.forEach(x=>{
    h+='<div class="rest-note" style="border-top:0;padding-top:0;color:var(--oxide)">'+x+'</div>';
  });
  return h;
}

      <div class="fld"><label>10mm R</label><input type="number" step="any" id="m_b10R" placeholder="—"></div>
    </div>
    <div class="fld" style="margin-top:11px"><label>Hang total (bodyweight + added)</label><input type="number" step="any" id="m_hang" placeholder="—"></div>
    <div class="actions" style="padding-left:0;padding-right:0;border-top:1px solid var(--line-soft);margin-top:6px">
      <button class="btn" id="btn-save-max">Record test</button>
    </div>
  </div>` + backupSection();
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// These used to sit in a strip under every tab. They belong to Settings —
// they are rare, deliberate actions, not something to see while training.
function backupSection(){
  const n = (S.log||[]).length, t = (S.tests||[]).length, j = (S.journal||[]).length;
  const row = (id, title, desc, label, cls) =>
      '<div class="actrow"><div><div class="actrow-t">'+title+'</div>'
    +   '<div class="actrow-d">'+desc+'</div></div>'
    +   '<button class="btn '+(cls||'')+'" id="'+id+'">'+label+'</button></div>';
  return '<div class="up"><h3>Backup &amp; data</h3>'
    + '<div class="card"><div class="fields">'
    + row("f-export","Export backup",
        "Everything on this device as one file — "+n+" session"+(n===1?"":"s")+", "+t+" test result"+(t===1?"":"s")+", "+j+" log entr"+(j===1?"y":"ies")+".",
        "Export")
    + row("f-import","Restore backup",
        "Replace what's here with a backup file. Use this after reinstalling.",
        "Restore")
    + row("f-csv","Export CSV",
        "Four tables — tests, sessions, logs, climbs — for a spreadsheet or BI tool.",
        "Export CSV")
    + row("f-undo","Undo last entry",
        "Removes the most recent session from the program log.",
        "Undo")
    + row("f-reset","Reset everything",
        "Deletes every session, test and log on this device. Cannot be undone.",
        "Reset","danger")
    + '</div></div></div>';
}
function wireBackup(){
  const undo = $("f-undo"); if(!undo) return;
  undo.onclick = ()=>{
    const ds = Object.keys(EN()).sort();
    if(!ds.length) return toast("Nothing to undo");
    const last = ds[ds.length-1];
    dropEntry(last);
    save(); render(); toast("Removed "+pretty(last));
  };
  $("f-export").onclick = ()=>{
    const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="finger-block-"+todayYmd()+".json"; a.click();
    toast("Exported");
  };
  // one file per table — a pivot table or a BI tool wants tables, not one wide sheet
  $("f-csv").onclick = ()=>{
    const q = v => (v==null ? "" : /[",\n]/.test(String(v)) ? '"'+String(v).replace(/"/g,'""')+'"' : String(v));
    const csv = (cols, rows) => cols.join(",")+"\n"+rows.map(r=>cols.map(c=>q(r[c])).join(",")).join("\n");
    const files = [
      ["tests", csv(["date","program","tool","hand","load","added","bw","protocol","note"], S.tests||[])],
      ["sessions", csv(["date","program","idx","status","name","rpe","notes","loadL","loadR"],
          (S.log||[]).map(e=>Object.assign({}, e, {
            loadL:e.loads?e.loads.L:null, loadR:e.loads?e.loads.R:null })))],
      ["logs", csv(["date","activity","field","value","unit","notes"],
          (S.journal||[]).reduce((acc,e)=>{
            const a = activityById(e.activityId) || {name:e.activityId, fields:[]};
            (a.fields||[]).forEach(f=>{
              const v = e.values[f.id];
              if(v==null) return;
              acc.push({date:e.date, activity:a.name, field:f.label,
                        value: f.type==="grade" ? v.grade : v,
                        unit:  f.type==="grade" ? v.scale : (f.unit||""),
                        notes: e.notes||""});
            });
            return acc;
          }, []))],
      ["climbs", csv(["date","activity","scale","grade","attempts","sent"],
          (S.journal||[]).reduce((acc,e)=>{
            const a = activityById(e.activityId) || {name:e.activityId};
            (e.problems||[]).forEach(p=>acc.push({date:e.date, activity:a.name,
              scale:p.scale, grade:p.grade, attempts:p.attempts, sent:p.sent?1:0}));
            return acc;
          }, []))]
    ];
    files.forEach(([name, body], i)=>{
      setTimeout(()=>{
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([body], {type:"text/csv"}));
        a.download = "finger-block-"+name+"-"+todayYmd()+".csv";
        a.click();
      }, i*300);
    });
    toast("Exported "+files.length+" CSV files");
  };
  $("f-import").onclick = ()=>{
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = ()=>{
      const f = inp.files && inp.files[0];
      if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{
        let d;
        try{ d = JSON.parse(r.result); }
        catch(e){ toast("Not a readable backup file"); return; }
        if(!d || typeof d !== "object" || (!d.log && !d.entries)){
          toast("That isn't a Finger Block backup"); return;
        }
        const n = (d.log ? d.log.length : Object.keys(d.entries||{}).length);
        if(!confirm("Replace everything on this device with this backup? It holds "
            + n + " logged session" + (n===1?"":"s") + ". What's here now will be lost.")) return;
        S = Object.assign(JSON.parse(JSON.stringify(DEFAULT)), migrate(d));
        S.log      = S.log      || [];
        S.tests    = S.tests    || [];
        S.programs = S.programs || {};
        S.drafts   = S.drafts   || {};
        S.journal  = S.journal  || [];
        if(!S.activities || !S.activities.length) S.activities = defaultActivities();
        PS(); refreshMaxes();
        stopTimer();
        save(); render();
        toast("Restored "+n+" session"+(n===1?"":"s"));
      };
      r.readAsText(f);
    };
    inp.click();
  };
  $("f-reset").onclick = ()=>{
    if(!confirm("Delete all logged sessions and maxes? This can't be undone.")) return;
    S = JSON.parse(JSON.stringify(DEFAULT));
    save(); render(); toast("Reset");
  };
}

function render(){
  renderRail();
  ["programs","logs","data","settings"].forEach(t=>{
    const el = $("tab-"+t);
    if(el) el.setAttribute("aria-selected", String(t===tab));
  });
  renderProgSwitch();   // syncs the overlay's open/closed state every render, not just when open
  const v = $("view");
  if(actEdit)              v.innerHTML = renderActEditor();
  else if(tab==="programs") v.innerHTML = renderPrograms();
  else if(tab==="logs")     v.innerHTML = renderLogs();
  else if(tab==="data")     v.innerHTML = renderHistory();
  else if(tab==="settings") v.innerHTML = renderSetup();
  wireAccordions();
  if(actEdit) wireActEditor(); else if(tab==="logs") wireLogs();
  if(tab==="settings") wireBackup();
  if(tab==="programs") wireProgSwitch();
  wire();
}

/* ============================== events ============================== */
function num(id){ const el=$(id); if(!el) return null; const v=parseFloat(el.value); return isFinite(v)?v:null; }

function wire(){
  const p = currentPlan();

  // Tapping the row body starts the sequence from that set.
  document.querySelectorAll("#fb .set-body").forEach(btn=>{
    btn.onclick = ()=>{ startPhase(+btn.dataset.i, "prep"); };
  });
  // The circle is a manual override — tick or untick without running the clock.
  document.querySelectorAll("#fb .tick").forEach(btn=>{
    btn.onclick = (ev)=>{
      ev.stopPropagation();
      const i = +btn.dataset.i;
      const d = S.drafts[draftKey(p.date)] || (S.drafts[draftKey(p.date)]=[]);
      d[i] = !d[i];
      if(T.ready===i) T.ready = null;
      save(); paintStack();
    };
  });
  const bu = $("btn-undo-skip");
  if(bu) bu.onclick = ()=>{
    const d = PS().lastSkip;
    if(d && EN()[d] && EN()[d].status==="missed") dropEntry(d);
    PS().lastSkip = null;
    save(); render(); toast("Skip undone — back to "+pretty(d));
  };
  const bs = $("btn-start");
  if(bs) bs.onclick = ()=>{
    const d = S.drafts[draftKey(p.date)] || [];
    const rows = ctxRows().rows;
    let i = 0; while(i < rows.length && d[i]) i++;
    if(i >= rows.length){ toast("Every set is already ticked"); return; }
    startPhase(i, "prep");
  };
  const ba = $("btn-auto");
  if(ba) ba.onclick = ()=> setAuto(!S.autoAdvance);
  const bc = $("btn-clear");
  if(bc) bc.onclick = ()=>{
    delete S.drafts[draftKey(p.date)]; save(); paintStack(); toast("Ticks cleared");
  };
  paintStack();

  const done = $("btn-done");
  if(done) done.onclick = ()=>{
    const pl = currentPlan();
    const def = pl.def;
    const e = {status:"done", idx:pl.idx, advances:pl.advances, name:def.name,
               rpe:num("f_rpe"), notes:($("f_notes")&&$("f_notes").value.trim())||""};
    const uL=num("f_useL"), uR=num("f_useR");
    if(uL!=null||uR!=null) e.loads={L:uL,R:uR};

    // capture test results
    const bw=num("f_bw"); if(bw!=null) S.bodyweight=bw;
    const b20L=num("f_b20L"), b20R=num("f_b20R");
    const b10L=num("f_b10L"), b10R=num("f_b10R");
    const added=num("f_added");
    // each test result is its own dated record — bodyweight and protocol travel
    // with it, because a load means nothing without them six months later
    const tbw = S.bodyweight;
    if(b20L!=null) addTest({tool:"block20", hand:"L", load:b20L, bw:tbw, protocol:"7s half crimp", date:pl.date});
    if(b20R!=null) addTest({tool:"block20", hand:"R", load:b20R, bw:tbw, protocol:"7s half crimp", date:pl.date});
    if(b10L!=null) addTest({tool:"block10", hand:"L", load:b10L, bw:tbw, protocol:"7s half crimp", date:pl.date});
    if(b10R!=null) addTest({tool:"block10", hand:"R", load:b10R, bw:tbw, protocol:"7s half crimp", date:pl.date});
    if(added!=null && tbw!=null)
      addTest({tool:"hang", hand:"both", load:tbw+added, added, bw:tbw, protocol:"10s half crimp", date:pl.date});

    if((def.kind==="test20"||def.kind==="test10"||def.kind==="testhang") &&
        b20L==null && b10L==null && added==null){
      if(!confirm("You haven't entered test numbers. Log this session anyway? Later loads will stay unprescribed.")) return;
    }

    S.snap = null;
    putEntry(pl.date, e);
    PS().lastSkip = null;
    delete S.drafts[draftKey(pl.date)];
    stopTimer();
    save(); render(); toast("Logged");
  };

  const miss = $("btn-miss");
  if(miss) miss.onclick = ()=>{
    const pl = currentPlan();
    putEntry(pl.date, {status:"missed", idx:pl.idx});
    PS().lastSkip = pl.date;
    delete S.drafts[draftKey(pl.date)];
    stopTimer();
    save(); render(); toast("Day skipped — schedule moved on");
  };

  const ss = $("btn-save-setup");
  if(ss) ss.onclick = ()=>{
    PS().startDate = $("s_start").value || PS().startDate;
    S.increment = num("s_inc") || 1.25;
    S.snap = null;
    S.tare = num("s_tare") || 0;
    const bw = num("s_bw"); if(bw!=null) S.bodyweight=bw;
    S.prep = num("s_prep"); if(S.prep==null) S.prep = 5;
    S.sound = $("s_sound").checked;
    S.keepAwake = $("s_awake").checked;
    save(); render(); toast("Saved");
  };
  document.querySelectorAll("#fb .seg-b").forEach(b=>{
    b.onclick = ()=>{
      const to = b.dataset.u;
      if(to === S.units) return;
      convertUnits(to);
      render();
      toast("Switched to "+to+" — all stored weights converted");
    };
  });
  const sm = $("btn-save-max");
  if(sm) sm.onclick = ()=>{
    S.snap = null;
    const dt = $("m_date").value || todayYmd();
    const mbw = S.bodyweight;
    let n = 0;
    const rec = (tool,hand,v,proto)=>{ if(v==null) return; n++;
      addTest({tool, hand, load:v, bw:mbw, protocol:proto, date:dt, note:"entered by hand"}); };
    rec("block20","L",num("m_b20L"),"7s half crimp");
    rec("block20","R",num("m_b20R"),"7s half crimp");
    rec("block10","L",num("m_b10L"),"7s half crimp");
    rec("block10","R",num("m_b10R"),"7s half crimp");
    rec("hang","both",num("m_hang"),"10s half crimp");
    if(!n){ toast("Nothing to record"); return; }
    save(); render(); toast("Recorded "+n+" result"+(n===1?"":"s"));
  };
}

["programs","logs","data","settings"].forEach(t=>{
  const el = $("tab-"+t);
  if(el) el.onclick = ()=>{
    tab=t; actEdit=null; editEntry=null;
    if(t==="programs") progSwitchOpen = true;
    render();
  };
});
function wireProgSwitch(){
  const x = $("progswitch-x"); if(x) x.onclick = ()=>{ progSwitchOpen=false; render(); };
  const bd = $("progswitch-backdrop"); if(bd) bd.onclick = ()=>{ progSwitchOpen=false; render(); };
}

/* ============================== boot ============================== */
(async function(){
  const raw = await load();
  const wasOld = !!(raw && raw.v !== 3);   // check BEFORE migrating, not after
  const stored = migrate(raw);
  S = stored ? Object.assign(JSON.parse(JSON.stringify(DEFAULT)), stored) : JSON.parse(JSON.stringify(DEFAULT));
  S.log      = S.log      || [];
  S.tests    = S.tests    || [];
  S.programs = S.programs || {};
  S.drafts   = S.drafts   || {};
  S.journal  = S.journal  || [];
  if(!S.activities || !S.activities.length) S.activities = defaultActivities();
  PS();                 // make sure this program has its own state block
  refreshMaxes();       // maxes are a cache over S.tests, never trusted from storage
  if(wasOld) save();                     // persist the migration once
  wireTimer();
  render();
})();

})();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
