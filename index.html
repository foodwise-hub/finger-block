  Object.keys(byDate).sort().reverse().forEach(d=>{
    const g = byDate[d];
    h += '<div class="tgrp"><div class="tgrp-d">'+pretty(d)
      +  (g[0].bw ? ' <span>bw '+fmt(g[0].bw)+' '+unit()+'</span>' : '')+'</div>';
    g.forEach(t=>{
      const sw = t.bw ? (t.load/t.bw).toFixed(2)+"x bw" : "";
      h += '<div class="line"><span class="d">'+(t.hand==="both"?"both":t.hand)+'</span>'
        +  '<span class="t">'+toolOf(t.tool).label+'<em>'+(t.protocol||"")+(t.note?' · '+esc(t.note):'')+'</em></span>'
        +  '<span class="r">'+fmt(t.load)+' '+unit()+(sw?'<em>'+sw+'</em>':'')+'</span></div>';
    });
    h += '</div>';
  });
  return h;
}

function dataSessions(){
  const en = EN();
  const ds = Object.keys(en).sort().reverse();
  if(!ds.length) return '<div class="empty">Nothing logged yet. Your first session is Friday 24 Jul.</div>';
  let h = '';
  ds.forEach(d=>{
    const e = en[d];
    const nm = e.status==="missed" ? (SESSIONS[e.idx] ? SESSIONS[e.idx].name : "Session") : (e.name||"Session");
    const detail = e.status==="missed" ? "skipped"
      : [ e.loads && (e.loads.L!=null||e.loads.R!=null)
            ? ("L "+fmt(e.loads.L)+" / R "+fmt(e.loads.R)+" "+unit()) : null,
          e.rpe ? ("RPE "+e.rpe) : null ].filter(Boolean).join(" · ");
    h += '<div class="line '+(e.status==="missed"?"missed":"")+'">'
      +  '<span class="d">'+pretty(d)+'</span>'
      +  '<span class="t">'+nm+(detail?'<em>'+detail+'</em>':'')
      +    (e.notes?'<em style="color:var(--pencil)">'+esc(e.notes)+'</em>':'')+'</span>'
      +  '<span class="r">'+(e.status==="missed"?"—":(e.advances===false?"re-entry":"#"+(e.idx+1)))+'</span></div>';
  });
  const total = ds.length, missed = ds.filter(d=>en[d].status==="missed").length;
  h += '<div class="line head" style="margin-top:8px;border-bottom:0">'
    +  '<span class="d"></span><span class="t">'+(total-missed)+' completed, '+missed+' skipped</span>'
    +  '<span class="r">'+Math.round((total-missed)/total*100)+'%</span></div>';
  const recent = slots(120).filter(s=>en[s]).slice(-6);
  const rm = recent.filter(s=>en[s].status==="missed").length;
  if(rm>=3) h += '<div class="banner warn" style="margin-top:14px"><span class="eyebrow">Pattern</span>'
    + 'You have skipped <b>'+rm+' of the last 6</b>. Three sessions a week may be the wrong dose right now — '
    + 'two quality sessions beats three you resent. The program runs on completed sessions, so dropping to '
    + 'two days a week just stretches it.</div>';
  return h;
}

function dataActivity(act){
  const es = entriesFor(act.id);
  if(!es.length) return '<div class="empty">Nothing logged for this activity yet.</div>';
  let h = '';
  es.slice(0,60).forEach(e=>{
    const bits = act.fields.map(f=>{
      const t = fieldText(f, e.values[f.id]);
      return t ? '<b>'+esc(f.label)+'</b> '+esc(t) : null;
    }).filter(Boolean);
    const np = (e.problems||[]).length;
    h += '<div class="logrow" style="grid-template-columns:74px 1fr">'
      +   '<div class="logrow-d">'+pretty(e.date)+'</div>'
      +   '<div class="logrow-v">'+(bits.join(" · ")||"—")
      +     (np ? '<em>'+(e.problems||[]).map(p=>esc(p.grade)+(p.sent?"":" ·proj")).join(", ")+'</em>' : '')
      +     (e.notes?'<em class="n">'+esc(e.notes)+'</em>':'')+'</div></div>';
  });
  return h;
}

function renderHistory(){
  let h = '';
  h += accSec("data:charts", "Charts", "4 views", dataCharts, true);
  h += accSec("data:tests", "Test log", (S.tests||[]).length+" results", dataTests);
  h += accSec("data:prog", "Program history", PROGRAM.name, dataSessions);
  (S.activities||[]).forEach(act=>{
    const n = entriesFor(act.id).length;
    h += accSec("data:act:"+act.id, act.name, n+" logged", ()=>dataActivity(act));
  });
  h += '<div class="up"><div class="cue" style="border:0">'
    +  'Everything here exports as CSV from Settings — one file per table, ready for a pivot or a proper BI tool.'
    +  '</div></div>';
  return h;
}
function renderSetup(){
  return `
  <div class="sec">
    <div class="fld"><label>Start date (first session)</label><input type="date" id="s_start" value="${PS().startDate}"></div>
    <div class="fld" style="margin-top:14px">
      <label>Units — converts everything already logged</label>
      <div class="seg" role="group" aria-label="Weight units">
        <button class="seg-b" data-u="lb" aria-pressed="${S.units==="lb"}">lb</button>
        <button class="seg-b" data-u="kg" aria-pressed="${S.units==="kg"}">kg</button>
      </div>
    </div>
    <div class="fld" style="margin-top:11px">
      <label>Smallest plate step (${S.units})</label>
      <input type="number" step="any" id="s_inc" value="${S.increment}">
    </div>
    <div class="duo" style="margin-top:11px">
      <div class="fld"><label>Hardware tare (${S.units})</label><input type="number" step="any" id="s_tare" value="${S.tare}"></div>
      <div class="fld"><label>Bodyweight (${S.units})</label><input type="number" step="any" id="s_bw" value="${S.bodyweight!=null?S.bodyweight:""}"></div>
    </div>
    <div class="cue" style="border:0;padding-top:12px">
      Tare is the weight of your pin, strap and carabiner. Every prescribed number below is
      <b>total load lifted</b>, so the tool subtracts tare to tell you what plates to actually add.
      Weigh the hardware once and you never think about it again.
    </div>
    <div class="prog-phase" style="margin-top:22px"><h4>Timer</h4><span>Hold and rest cues</span></div>
    <div class="duo">
      <div class="fld"><label>Get-set countdown (s)</label><input type="number" step="1" min="0" id="s_prep" value="${S.prep}"></div>
      <div class="fld"><label>Rest between sets</label><input value="from the program" disabled style="opacity:.5"></div>
    </div>
    <label class="chk"><input type="checkbox" id="s_sound" ${S.sound?"checked":""}> Beeps and vibration</label>
    <label class="chk"><input type="checkbox" id="s_awake" ${S.keepAwake?"checked":""}> Keep the screen awake while timing</label>
    <div class="cue" style="border:0;padding-top:10px">
      Tap any row to start there. The countdown takes over the screen for get-set → hold → rest
      and ticks the set off when the hold ends. The last five seconds of rest go red and tick like
      a clock. <b>Auto</b> — the switch on the session card, or the chip in the top corner while
      the clock runs — chains every set to the end without you touching the screen; with it off,
      the countdown clears after each rest so you tap the next set yourself. Pause works in both.
    </div>
    <div class="actions" style="padding-left:0;padding-right:0;border-top:1px solid var(--line-soft);margin-top:6px">
      <button class="btn primary" id="btn-save-setup">Save settings</button>
    </div>
  </div>
  <div class="up">
    <h3>Record a test by hand</h3>
    <div class="cue" style="border:0;padding:0 0 10px">
      Use this if you tested outside a program session. Every entry is dated and kept —
      nothing overwrites anything, so the charts keep the full history.
    </div>
    <div class="fld"><label>Date of test</label><input type="date" id="m_date" value="${todayYmd()}"></div>
    <div class="duo">
      <div class="fld"><label>20mm L</label><input type="number" step="any" id="m_b20L" placeholder="—"></div>
      <div class="fld"><label>20mm R</label><input type="number" step="any" id="m_b20R" placeholder="—"></div>
    </div>
    <div class="duo" style="margin-top:11px">
      <div class="fld"><label>10mm L</label><input type="number" step="any" id="m_b10L" placeholder="—"></div>
      <div class="fld"><label>10mm R</label><input type="number" step="any" id="m_b10R" placeholder="—"></div>
    </div>
    <div class="fld" style="margin-top:11px"><label>Hang total (bodyweight + added)</label><input type="number" step="any" id="m_hang" placeholder="—"></div>
    <div class="actions" style="padding-left:0;padding-right:0;border-top:1px solid var(--line-soft);margin-top:6px">
      <button class="btn" id="btn-save-max">Record test</button>
    </div>
  </div>`;
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function renderFoot(){
  $("foot").innerHTML =
    '<button id="f-undo">Undo last entry</button>'+
    '<button id="f-export">Export backup</button>'+
    '<button id="f-import">Restore backup</button>'+
    '<button id="f-csv">Export CSV</button>'+
    '<button id="f-reset">Reset everything</button>';
  $("f-undo").onclick = ()=>{
    const ds = Object.keys(EN()).sort();
    if(!ds.length) return toast("Nothing to undo");
    const last = ds[ds.length-1];
    dropEntry(last);
    save(); render(); toast("Removed "+pretty(last));
  };
  $("f-export").onclick = ()=>{
    const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="finger-block-"+todayYmd()+".json"; a.click();
    toast("Exported");
  };
  // one file per table — a pivot table or a BI tool wants tables, not one wide sheet
  $("f-csv").onclick = ()=>{
    const q = v => (v==null ? "" : /[",\n]/.test(String(v)) ? '"'+String(v).replace(/"/g,'""')+'"' : String(v));
    const csv = (cols, rows) => cols.join(",")+"\n"+rows.map(r=>cols.map(c=>q(r[c])).join(",")).join("\n");
    const files = [
      ["tests", csv(["date","program","tool","hand","load","added","bw","protocol","note"], S.tests||[])],
      ["sessions", csv(["date","program","idx","status","name","rpe","notes","loadL","loadR"],
          (S.log||[]).map(e=>Object.assign({}, e, {
            loadL:e.loads?e.loads.L:null, loadR:e.loads?e.loads.R:null })))],
      ["logs", csv(["date","activity","field","value","unit","notes"],
          (S.journal||[]).reduce((acc,e)=>{
            const a = activityById(e.activityId) || {name:e.activityId, fields:[]};
            (a.fields||[]).forEach(f=>{
              const v = e.values[f.id];
              if(v==null) return;
              acc.push({date:e.date, activity:a.name, field:f.label,
                        value: f.type==="grade" ? v.grade : v,
                        unit:  f.type==="grade" ? v.scale : (f.unit||""),
                        notes: e.notes||""});
            });
            return acc;
          }, []))],
      ["climbs", csv(["date","activity","scale","grade","attempts","sent"],
          (S.journal||[]).reduce((acc,e)=>{
            const a = activityById(e.activityId) || {name:e.activityId};
            (e.problems||[]).forEach(p=>acc.push({date:e.date, activity:a.name,
              scale:p.scale, grade:p.grade, attempts:p.attempts, sent:p.sent?1:0}));
            return acc;
          }, []))]
    ];
    files.forEach(([name, body], i)=>{
      setTimeout(()=>{
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([body], {type:"text/csv"}));
        a.download = "finger-block-"+name+"-"+todayYmd()+".csv";
        a.click();
      }, i*300);
    });
    toast("Exported "+files.length+" CSV files");
  };
  $("f-import").onclick = ()=>{
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = ()=>{
      const f = inp.files && inp.files[0];
      if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{
        let d;
        try{ d = JSON.parse(r.result); }
        catch(e){ toast("Not a readable backup file"); return; }
        if(!d || typeof d !== "object" || (!d.log && !d.entries)){
          toast("That isn't a Finger Block backup"); return;
        }
        const n = (d.log ? d.log.length : Object.keys(d.entries||{}).length);
        if(!confirm("Replace everything on this device with this backup? It holds "
            + n + " logged session" + (n===1?"":"s") + ". What's here now will be lost.")) return;
        S = Object.assign(JSON.parse(JSON.stringify(DEFAULT)), migrate(d));
        S.log      = S.log      || [];
        S.tests    = S.tests    || [];
        S.programs = S.programs || {};
        S.drafts   = S.drafts   || {};
        S.journal  = S.journal  || [];
        if(!S.activities || !S.activities.length) S.activities = defaultActivities();
        PS(); refreshMaxes();
        stopTimer();
        save(); render();
        toast("Restored "+n+" session"+(n===1?"":"s"));
      };
      r.readAsText(f);
    };
    inp.click();
  };
  $("f-reset").onclick = ()=>{
    if(!confirm("Delete all logged sessions and maxes? This can't be undone.")) return;
    S = JSON.parse(JSON.stringify(DEFAULT));
    save(); render(); toast("Reset");
  };
}

function render(){
  renderRail();
  ["programs","logs","data","settings"].forEach(t=>{
    const el = $("tab-"+t);
    if(el) el.setAttribute("aria-selected", String(t===tab));
  });
  const v = $("view");
  if(actEdit)              v.innerHTML = renderActEditor();
  else if(tab==="programs") v.innerHTML = renderPrograms();
  else if(tab==="logs")     v.innerHTML = renderLogs();
  else if(tab==="data")     v.innerHTML = renderHistory();
  else if(tab==="settings") v.innerHTML = renderSetup();
  wireAccordions();
  if(actEdit) wireActEditor(); else if(tab==="logs") wireLogs();
  wire();
}

/* ============================== events ============================== */
function num(id){ const el=$(id); if(!el) return null; const v=parseFloat(el.value); return isFinite(v)?v:null; }

function wire(){
  const p = currentPlan();

  // Tapping the row body starts the sequence from that set.
  document.querySelectorAll("#fb .set-body").forEach(btn=>{
    btn.onclick = ()=>{ startPhase(+btn.dataset.i, "prep"); };
  });
  // The circle is a manual override — tick or untick without running the clock.
  document.querySelectorAll("#fb .tick").forEach(btn=>{
    btn.onclick = (ev)=>{
      ev.stopPropagation();
      const i = +btn.dataset.i;
      const d = S.drafts[draftKey(p.date)] || (S.drafts[draftKey(p.date)]=[]);
      d[i] = !d[i];
      if(T.ready===i) T.ready = null;
      save(); paintStack();
    };
  });
  const bu = $("btn-undo-skip");
  if(bu) bu.onclick = ()=>{
    const d = PS().lastSkip;
    if(d && EN()[d] && EN()[d].status==="missed") dropEntry(d);
    PS().lastSkip = null;
    save(); render(); toast("Skip undone — back to "+pretty(d));
  };
  const bs = $("btn-start");
  if(bs) bs.onclick = ()=>{
    const d = S.drafts[draftKey(p.date)] || [];
    const rows = ctxRows().rows;
    let i = 0; while(i < rows.length && d[i]) i++;
    if(i >= rows.length){ toast("Every set is already ticked"); return; }
    startPhase(i, "prep");
  };
  const ba = $("btn-auto");
  if(ba) ba.onclick = ()=> setAuto(!S.autoAdvance);
  const bc = $("btn-clear");
  if(bc) bc.onclick = ()=>{
    delete S.drafts[draftKey(p.date)]; save(); paintStack(); toast("Ticks cleared");
  };
  paintStack();

  const done = $("btn-done");
  if(done) done.onclick = ()=>{
    const pl = currentPlan();
    const def = pl.def;
    const e = {status:"done", idx:pl.idx, advances:pl.advances, name:def.name,
               rpe:num("f_rpe"), notes:($("f_notes")&&$("f_notes").value.trim())||""};
    const uL=num("f_useL"), uR=num("f_useR");
    if(uL!=null||uR!=null) e.loads={L:uL,R:uR};

    // capture test results
    const bw=num("f_bw"); if(bw!=null) S.bodyweight=bw;
    const b20L=num("f_b20L"), b20R=num("f_b20R");
    const b10L=num("f_b10L"), b10R=num("f_b10R");
    const added=num("f_added");
    // each test result is its own dated record — bodyweight and protocol travel
    // with it, because a load means nothing without them six months later
    const tbw = S.bodyweight;
    if(b20L!=null) addTest({tool:"block20", hand:"L", load:b20L, bw:tbw, protocol:"7s half crimp", date:pl.date});
    if(b20R!=null) addTest({tool:"block20", hand:"R", load:b20R, bw:tbw, protocol:"7s half crimp", date:pl.date});
    if(b10L!=null) addTest({tool:"block10", hand:"L", load:b10L, bw:tbw, protocol:"7s half crimp", date:pl.date});
    if(b10R!=null) addTest({tool:"block10", hand:"R", load:b10R, bw:tbw, protocol:"7s half crimp", date:pl.date});
    if(added!=null && tbw!=null)
      addTest({tool:"hang", hand:"both", load:tbw+added, added, bw:tbw, protocol:"10s half crimp", date:pl.date});

    if((def.kind==="test20"||def.kind==="test10"||def.kind==="testhang") &&
        b20L==null && b10L==null && added==null){
      if(!confirm("You haven't entered test numbers. Log this session anyway? Later loads will stay unprescribed.")) return;
    }

    S.snap = null;
    putEntry(pl.date, e);
    PS().lastSkip = null;
    delete S.drafts[draftKey(pl.date)];
    stopTimer();
    save(); render(); toast("Logged");
  };

  const miss = $("btn-miss");
  if(miss) miss.onclick = ()=>{
    const pl = currentPlan();
    putEntry(pl.date, {status:"missed", idx:pl.idx});
    PS().lastSkip = pl.date;
    delete S.drafts[draftKey(pl.date)];
    stopTimer();
    save(); render(); toast("Day skipped — schedule moved on");
  };

  const ss = $("btn-save-setup");
  if(ss) ss.onclick = ()=>{
    PS().startDate = $("s_start").value || PS().startDate;
    S.increment = num("s_inc") || 1.25;
    S.snap = null;
    S.tare = num("s_tare") || 0;
    const bw = num("s_bw"); if(bw!=null) S.bodyweight=bw;
    S.prep = num("s_prep"); if(S.prep==null) S.prep = 5;
    S.sound = $("s_sound").checked;
    S.keepAwake = $("s_awake").checked;
    save(); render(); toast("Saved");
  };
  document.querySelectorAll("#fb .seg-b").forEach(b=>{
    b.onclick = ()=>{
      const to = b.dataset.u;
      if(to === S.units) return;
      convertUnits(to);
      render();
      toast("Switched to "+to+" — all stored weights converted");
    };
  });
  const sm = $("btn-save-max");
  if(sm) sm.onclick = ()=>{
    S.snap = null;
    const dt = $("m_date").value || todayYmd();
    const mbw = S.bodyweight;
    let n = 0;
    const rec = (tool,hand,v,proto)=>{ if(v==null) return; n++;
      addTest({tool, hand, load:v, bw:mbw, protocol:proto, date:dt, note:"entered by hand"}); };
    rec("block20","L",num("m_b20L"),"7s half crimp");
    rec("block20","R",num("m_b20R"),"7s half crimp");
    rec("block10","L",num("m_b10L"),"7s half crimp");
    rec("block10","R",num("m_b10R"),"7s half crimp");
    rec("hang","both",num("m_hang"),"10s half crimp");
    if(!n){ toast("Nothing to record"); return; }
    save(); render(); toast("Recorded "+n+" result"+(n===1?"":"s"));
  };
}

["programs","logs","data","settings"].forEach(t=>{
  const el = $("tab-"+t);
  if(el) el.onclick = ()=>{ tab=t; actEdit=null; editEntry=null; render(); };
});

/* ============================== boot ============================== */
(async function(){
  const raw = await load();
  const wasOld = !!(raw && raw.v !== 3);   // check BEFORE migrating, not after
  const stored = migrate(raw);
  S = stored ? Object.assign(JSON.parse(JSON.stringify(DEFAULT)), stored) : JSON.parse(JSON.stringify(DEFAULT));
  S.log      = S.log      || [];
  S.tests    = S.tests    || [];
  S.programs = S.programs || {};
  S.drafts   = S.drafts   || {};
  S.journal  = S.journal  || [];
  if(!S.activities || !S.activities.length) S.activities = defaultActivities();
  PS();                 // make sure this program has its own state block
  refreshMaxes();       // maxes are a cache over S.tests, never trusted from storage
  if(wasOld) save();                     // persist the migration once
  renderFoot();
  wireTimer();
  render();
})();

})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){ /* offline cache unavailable */ });
  });
}
</script>
