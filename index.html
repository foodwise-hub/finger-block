<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finger Block</title><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10161C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finger Block">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>html,body{margin:0;padding:0;background:#10161C;}</style></head><body>
<style>

  /* ============================================================
     WALL FACE — dark alpine glass.
     Palette pulled from the hero photograph: storm-slate ground,
     the warm gold of the light rays as the single accent, alpine
     green for anything completed. No shadows anywhere; depth comes
     from a lit top edge on every surface, the way light falls on
     rock. Old variable names are kept as aliases so the charts and
     route line need no changes.
     ============================================================ */
  :root{
    --night:      #10161C;
    --night-2:    #0B1015;
    --sheet-top:  #16202A;

    --glass:      rgba(255,255,255,.055);
    --glass-2:    rgba(255,255,255,.085);
    --glass-3:    rgba(255,255,255,.13);
    --inset:      rgba(0,0,0,.22);

    --line:       rgba(255,255,255,.09);
    --line-hi:    rgba(255,255,255,.17);

    --text:       #EEF2F5;
    --muted:      #A3B0BC;
    --dim:        #6E7C89;

    --gold:       #E3C089;
    --gold-dim:   #A88E62;
    --green:      #8FAA83;
    --alarm:      #D2705A;
    --violet:     #8E82AD;

    /* spacing scale — everything below uses these, nothing in between */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px;

    --r-card:22px; --r-field:14px; --r-pill:999px;
    --hero-h: clamp(280px, 47vh, 420px);

    --red:       #E2452F;
    --red-soft:  rgba(226,69,47,.16);
    --anchor-a:  #57C278;
    --anchor-b:  #9C7FE0;

    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;
    --serif: Georgia, "Iowan Old Style", serif;

    /* aliases so existing JS (charts, rail, inline styles) keeps working */
    --paper:var(--night); --card:var(--glass); --card-2:var(--glass-2);
    --sunk:var(--inset); --rule:var(--line); --rule-2:var(--line);
    --edge:var(--line); --ink:var(--text); --pencil:var(--muted); --faint:var(--dim);
    --oxide:var(--gold); --oxide-soft:var(--gold-dim); --moss:var(--green);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--night);}

  /* ---------- hero: fixed, content scrolls over it ---------- */
  .hero{
    position:fixed; top:0; left:0; right:0; height:var(--hero-h);
    z-index:0; overflow:hidden; background:var(--night-2);
  }
  .hero img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;display:block;}
  .hero-veil{
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(8,12,16,.55) 0%, rgba(8,12,16,0) 34%, rgba(11,16,21,.72) 82%, var(--night) 100%);
  }
  .hero-top{
    position:absolute; left:0; right:0; top:calc(env(safe-area-inset-top) + 18px);
    padding:0 var(--s5); display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3);
  }
  .hero-top h1{
    margin:0; font-family:var(--sans); font-size:19px; font-weight:600; color:#fff;
    letter-spacing:.005em; text-shadow:0 1px 12px rgba(0,0,0,.5);
  }
  .hero-top .count{
    font-family:var(--mono); font-size:11px; color:rgba(255,255,255,.72);
    letter-spacing:.06em; text-shadow:0 1px 10px rgba(0,0,0,.5);
  }
  /* the routes, drawn up the wall itself — five lanes, tallest in the middle
     of the rock face, clear of the clouds above and the sheet edge below */
  .rail{
    position:absolute; left:0; right:0; top:21%; bottom:46px;
    display:flex; align-items:flex-end; justify-content:center;
    padding:0 var(--s3);
  }
  .rail svg{height:100%;width:auto;max-width:100%;display:block;overflow:visible;}
  .rail .stn{cursor:pointer;}

  /* ---------- the sheet that slides over the photo ---------- */
  #fb{
    position:relative; z-index:2; font-family:var(--sans); color:var(--text);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
    max-width:640px; margin:0 auto; padding-top:var(--hero-h);
    pointer-events:none;   /* the empty top padding must not swallow taps meant for the hero */
  }
  .sheet{
    background:linear-gradient(180deg, var(--sheet-top) 0%, var(--night) 160px);
    border-top:1px solid var(--line-hi);
    border-radius:28px 28px 0 0;
    min-height:78vh;
    padding:var(--s6) var(--s4) calc(112px + env(safe-area-inset-bottom));
    pointer-events:auto;   /* re-enable inside the actual visible card */
  }
  #fb h1,#fb h2,#fb h3,#fb h4{margin:0;font-weight:600;letter-spacing:-.012em;}
  #fb button{font-family:inherit;cursor:pointer;}
  #fb input,#fb textarea,#fb select{font-family:var(--sans);}

  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .wrap{padding:0;}

  /* ---------- station detail popped from the route ---------- */
  .railinfo{display:none;}
  .railinfo.on{
    display:block;position:relative;margin:0 0 var(--s4);padding:var(--s4) 40px var(--s4) var(--s4);
    background:linear-gradient(180deg,var(--glass-2),var(--glass));
    border:1px solid var(--line);border-top-color:var(--line-hi);border-radius:var(--r-card);
  }
  .stn-x{position:absolute;top:10px;right:12px;background:none;border:0;cursor:pointer;
    color:var(--dim);font-size:20px;line-height:1;padding:4px 6px;}
  .stn-n{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);}
  .stn-t{font-size:18px;font-weight:600;margin-top:var(--s1);}
  .stn-s{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:var(--s1);}
  .stn-st{font-family:var(--mono);font-size:11px;color:var(--gold);margin-top:var(--s2);letter-spacing:.04em;}
  .railinfo.done .stn-st{color:var(--green);}
  .stn-note{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--muted);margin-top:var(--s2);}

  /* ---------- bottom navigation, floating ---------- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;justify-content:center;
    padding:0 var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
    pointer-events:none;
  }
  .tabbar-in{
    pointer-events:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s1);
    width:100%;max-width:440px;padding:var(--s1);
    background:rgba(20,28,36,.82);
    -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
    border:1px solid var(--line);border-top-color:var(--line-hi);
    border-radius:var(--r-pill);
  }
  .tabbar button{
    background:none;border:0;border-radius:var(--r-pill);padding:9px 4px 8px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--dim);font-size:10.5px;font-weight:500;letter-spacing:.01em;
    transition:color .16s ease,background .16s ease;
  }
  .tabbar button svg{width:19px;height:19px;stroke-width:1.7;}
  .tabbar button[aria-selected="true"]{color:var(--text);background:var(--glass-2);}
  .tabbar button[aria-selected="true"] svg{stroke:var(--gold);}
  .tabbar button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;}

  /* ---------- cards: lit top edge, no shadow ---------- */
  .card,.acc,.chart,.entryform,.banner{
    background:linear-gradient(180deg,var(--glass-2) 0%,var(--glass) 100%);
    border:1px solid var(--line);border-top-color:var(--line-hi);
    border-radius:var(--r-card);
  }
  .card{overflow:hidden;}
  .card-head{padding:var(--s5);border-bottom:1px solid var(--line);}
  .card-head .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3);margin-bottom:var(--s2);}
  .card-head h2{font-size:23px;line-height:1.14;font-weight:600;}
  .grade{
    flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:var(--r-pill);
    background:var(--glass-2);border:1px solid var(--line-hi);color:var(--gold);
    font-family:var(--mono);font-size:13px;font-weight:600;
  }
  .specs{
    display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s5) var(--s3);
    margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--line);
  }
  .specs .k{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:var(--s1);}
  .specs .v{font-size:17px;font-weight:600;line-height:1.2;letter-spacing:-.01em;}
  .specs .v small{font-size:11px;font-weight:500;color:var(--muted);}
  .addon{
    margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--line);
    font-family:var(--mono);font-size:11px;color:var(--muted);
  }
  .addon b{color:var(--green);font-weight:600;}
  .cue{
    font-family:var(--serif);font-style:italic;font-size:13.5px;line-height:1.6;color:var(--muted);
    margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--line);
  }

  /* ---------- set stack ---------- */
  .startbar{display:flex;gap:var(--s2);padding:var(--s4) var(--s5);border-bottom:1px solid var(--line);}
  .startbar .btn{flex:1;}
  .stack{padding:var(--s2) 0;}
  .blockhead{
    display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;
    padding:var(--s3) var(--s5) var(--s2);
    font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);
  }
  .blockhead span{color:var(--dim);letter-spacing:.05em;text-transform:none;font-size:10.5px;}
  .set{
    position:relative;display:grid;grid-template-columns:1fr 30px;align-items:center;gap:var(--s3);
    padding:0 var(--s5);height:50px;
  }
  .set + .set{border-top:1px solid var(--line);}
  .set .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(227,192,137,.10);pointer-events:none;}
  .set.active{background:var(--glass);box-shadow:inset 3px 0 0 var(--gold);}
  .set.active.resting{box-shadow:inset 3px 0 0 var(--green);}
  .set.active.resting .fill{background:rgba(143,170,131,.10);}
  .set.next{box-shadow:inset 3px 0 0 var(--gold-dim);background:var(--glass);}
  .set-body{
    display:grid;grid-template-columns:52px 24px 1fr;gap:var(--s3);align-items:center;
    background:none;border:0;padding:0;height:100%;width:100%;text-align:left;color:inherit;
    position:relative;z-index:1;
  }
  .set .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;}
  .set .hand{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--muted);}
  .set .load{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .set .load small{font-size:11px;color:var(--muted);margin-left:2px;}
  .set .tick{
    justify-self:end;width:24px;height:24px;border:1.5px solid var(--line-hi);border-radius:var(--r-pill);
    display:grid;place-items:center;font-size:12px;color:transparent;background:none;padding:0;
    position:relative;z-index:1;transition:background .15s ease,border-color .15s ease;
  }
  .set[data-on="true"] .load{color:var(--dim);text-decoration:line-through;}
  .set[data-on="true"] .hand{color:var(--dim);}
  .set[data-on="true"] .tick{background:var(--green);border-color:var(--green);color:var(--night);}
  .set-body:focus-visible,.set .tick:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;}
  .rest-note{
    padding:var(--s3) var(--s5);font-family:var(--mono);font-size:10.5px;color:var(--dim);
    border-top:1px solid var(--line);letter-spacing:.03em;
  }

  /* ---------- accordions ---------- */
  .acc{margin-bottom:var(--s3);overflow:hidden;}
  .acc-h{
    width:100%;display:grid;grid-template-columns:1fr auto 20px;align-items:center;gap:var(--s3);
    background:none;border:0;padding:var(--s5);text-align:left;color:var(--text);
  }
  .acc.open .acc-h{border-bottom:1px solid var(--line);}
  .acc-n{font-size:16px;font-weight:600;letter-spacing:-.01em;}
  .acc-m{font-family:var(--mono);font-size:10px;letter-spacing:.09em;color:var(--dim);text-transform:uppercase;}
  .acc-c{font-family:var(--mono);font-size:17px;color:var(--gold);text-align:center;line-height:1;}
  .acc-h:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;}
  .acc-b{padding:var(--s5);}
  .acc-b > .card{border:0;background:none;border-radius:0;}
  .acc-b > .card .card-head{padding:0 0 var(--s5);}
  .acc-b > .card .startbar{padding:var(--s4) 0;}
  .acc-b > .card .stack{padding:0;}
  .acc-b > .card .set{padding:0;}
  .acc-b > .card .blockhead{padding:var(--s4) 0 var(--s2);}
  .acc-b > .card .rest-note{padding:var(--s3) 0;}
  .acc-b > .card .fields,.acc-b > .card .actions{padding-left:0;padding-right:0;}

  /* ---------- buttons ---------- */
  .btn{
    border:1px solid var(--line);border-top-color:var(--line-hi);
    background:linear-gradient(180deg,var(--glass-2),var(--glass));
    color:var(--text);padding:13px var(--s5);border-radius:var(--r-pill);
    font-size:14px;font-weight:600;letter-spacing:.005em;
    transition:background .16s ease,border-color .16s ease;
  }
  .btn:hover{background:var(--glass-3);}
  .btn.primary{background:var(--gold);border-color:var(--gold);color:#1B1406;font-weight:700;}
  .btn.primary:hover{background:#EFD09E;}
  .btn.ghost{background:none;color:var(--muted);}
  .btn.ghost:hover{color:var(--text);border-color:var(--line-hi);}
  .btn.sm{padding:10px var(--s4);font-size:13px;}
  .btn.skip{background:none;color:var(--muted);}
  .btn.undo{display:block;width:100%;margin-top:var(--s3);background:var(--gold);border-color:var(--gold);color:#1B1406;}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .btn[disabled]{opacity:.42;cursor:default;}
  .actions{display:grid;grid-template-columns:1fr auto;gap:var(--s3);padding:var(--s5);border-top:1px solid var(--line);}

  /* ---------- forms ---------- */
  .fields{padding:var(--s5);border-top:1px solid var(--line);display:grid;gap:var(--s4);}
  .fld label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-bottom:var(--s2);}
  .fld input,.fld textarea,.fld select{
    width:100%;background:var(--inset);border:1px solid var(--line);border-radius:var(--r-field);
    color:var(--text);padding:13px var(--s4);font-size:15px;
  }
  .fld textarea{resize:vertical;min-height:64px;line-height:1.5;}
  .fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--gold-dim);}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);}
  .chk{display:flex;align-items:center;gap:var(--s3);font-size:14px;color:var(--text);padding:var(--s3) 0;cursor:pointer;}
  .chk input{width:19px;height:19px;accent-color:var(--gold);}
  .seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r-pill);overflow:hidden;background:var(--inset);}
  .seg-b{
    background:none;border:0;padding:12px 0;cursor:pointer;color:var(--muted);
    font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  }
  .seg-b[aria-pressed="true"]{background:var(--gold);color:#1B1406;}
  .seg-b:focus-visible{outline:2px solid var(--text);outline-offset:-3px;}

  /* ---------- banners ---------- */
  .banner{padding:var(--s4);font-size:13.5px;margin-bottom:var(--s4);line-height:1.55;border-left:3px solid var(--green);}
  .banner.warn{border-left-color:var(--gold);}
  .banner.skipped{border-left-color:var(--dim);}
  .banner b{font-weight:700;}
  .banner .eyebrow{display:block;margin-bottom:var(--s1);color:var(--green);}
  .banner.warn .eyebrow{color:var(--gold);}
  .banner.skipped .eyebrow{color:var(--muted);}

  /* ---------- lists ---------- */
  .up{margin-top:var(--s6);}
  .up h3,.sec h3{font-family:var(--mono);font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);margin-bottom:var(--s3);font-weight:600;}
  .line{display:grid;grid-template-columns:78px 1fr auto;gap:var(--s3);align-items:baseline;padding:var(--s3) 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .line .d{font-family:var(--mono);font-size:11px;color:var(--dim);}
  .line .t{color:var(--text);}
  .line .t em{font-style:normal;color:var(--muted);font-size:11.5px;display:block;font-family:var(--mono);margin-top:2px;}
  .line .r{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;}
  .line.missed .t{color:var(--dim);text-decoration:line-through;}
  .line.missed .r{color:var(--gold);}
  .line.head{border-bottom:1px solid var(--line-hi);}
  .prog-phase{margin:var(--s6) 0 var(--s2);display:flex;align-items:baseline;gap:var(--s2);}
  .prog-phase h4{font-size:15px;font-weight:600;}
  .prog-phase span{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;}
  .empty{color:var(--dim);font-size:13.5px;padding:var(--s4) 0;font-family:var(--serif);font-style:italic;}
  .rule{padding:var(--s4) 0;border-bottom:1px solid var(--line);}
  .rule:last-child{border-bottom:0;}
  .rule-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--gold);margin-bottom:var(--s1);}
  .rule-v{font-family:var(--serif);font-size:13.5px;line-height:1.6;color:var(--muted);}
  .addprog{display:flex;flex-direction:column;gap:var(--s3);}

  /* ---------- charts ---------- */
  .chart-box{margin-bottom:var(--s6);}
  .chart-t{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--gold);margin-bottom:var(--s2);}
  .chart{padding:var(--s3) var(--s2) var(--s2);}
  .chart svg{width:100%;height:auto;display:block;}
  .chart .ct{font-family:var(--mono);font-size:7.5px;fill:var(--dim);}
  .chart-key{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);padding:var(--s2) var(--s2) 0;font-family:var(--mono);font-size:9.5px;color:var(--dim);}
  .chart-key span{display:flex;align-items:center;gap:5px;}
  .chart-key i{width:10px;height:3px;border-radius:2px;display:block;}
  .chart-empty{
    background:var(--inset);border:1px dashed var(--line-hi);border-radius:var(--r-field);
    padding:var(--s4);font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.55;color:var(--muted);
  }
  .tgrp{margin-bottom:var(--s4);}
  .tgrp-d{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text);padding-bottom:var(--s2);border-bottom:1px solid var(--line-hi);}
  .tgrp-d span{color:var(--dim);}
  .tgrp .line .r em{font-style:normal;display:block;font-size:9.5px;color:var(--dim);}

  /* ---------- logs ---------- */
  .entryform{padding:var(--s4);}
  .entryform .fld{margin-bottom:var(--s3);}
  .entryact{display:flex;gap:var(--s2);margin-top:var(--s4);}
  .gradepick{display:grid;grid-template-columns:86px 1fr;gap:var(--s2);}
  .probs{margin:var(--s2) 0 var(--s3);}
  .probs-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--gold);margin-bottom:var(--s2);}
  .probs-h span{color:var(--dim);letter-spacing:.04em;text-transform:none;font-size:10.5px;}
  .prow{display:grid;grid-template-columns:70px 1fr 56px auto 26px;gap:6px;align-items:center;margin-bottom:6px;}
  .prow select,.prow input[type=number]{
    background:var(--inset);border:1px solid var(--line);border-radius:10px;color:var(--text);
    padding:9px 6px;font-family:var(--mono);font-size:13px;width:100%;
  }
  .p-sent{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;color:var(--dim);}
  .p-sent input{width:16px;height:16px;accent-color:var(--green);}
  .p-x{background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer;padding:0;}
  .loghist{margin-top:var(--s5);}
  .loghist h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);margin-bottom:var(--s2);}
  .logrow{display:grid;grid-template-columns:78px 1fr auto;gap:var(--s3);align-items:baseline;padding:var(--s3) 0;border-bottom:1px solid var(--line);}
  .logrow-d{font-family:var(--mono);font-size:11px;color:var(--dim);}
  .logrow-v{font-size:13px;line-height:1.5;}
  .logrow-v b{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;}
  .logrow-v em{font-style:normal;display:block;font-family:var(--mono);font-size:10.5px;color:var(--green);margin-top:2px;}
  .logrow-v em.n{font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--muted);}
  .logrow-a{display:flex;gap:var(--s2);align-items:center;}
  .logrow-a button{background:none;border:0;cursor:pointer;font-family:var(--mono);font-size:10.5px;color:var(--dim);padding:2px;}
  .logrow-a button:hover{color:var(--text);}
  .lg-del{font-size:16px !important;}
  .fieldrow{display:grid;grid-template-columns:1fr auto 24px;gap:var(--s3);align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--line);}
  .fr-l{font-size:14px;font-weight:600;}
  .fr-t{font-family:var(--mono);font-size:10px;color:var(--dim);}
  .fr-x{background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer;padding:0;}
  .presets{display:flex;flex-wrap:wrap;gap:var(--s2);}
  .pchip{
    background:var(--inset);border:1px solid var(--line);border-radius:var(--r-pill);cursor:pointer;
    padding:9px var(--s4);font-family:var(--mono);font-size:11px;color:var(--text);
  }
  .pchip:hover{border-color:var(--gold-dim);color:var(--gold);}

  /* ---------- settings: backup rows ---------- */
  .actrow{
    display:grid;grid-template-columns:1fr auto;gap:var(--s4);align-items:center;
    padding:var(--s4) 0;border-bottom:1px solid var(--line);
  }
  .actrow:last-of-type{border-bottom:0;}
  .actrow-t{font-size:14.5px;font-weight:600;}
  .actrow-d{font-size:12.5px;color:var(--dim);line-height:1.45;margin-top:2px;}
  .actrow .btn{padding:10px var(--s4);font-size:13px;white-space:nowrap;}
  .actrow .btn.danger{color:var(--alarm);border-color:rgba(210,112,90,.35);background:none;}
  .actrow .btn.danger:hover{background:rgba(210,112,90,.12);}

  /* ---------- countdown ---------- */
  .tover{
    position:fixed;inset:0;z-index:60;font-family:var(--sans);color:var(--text);
    background:linear-gradient(180deg,var(--sheet-top) 0%,var(--night) 45%,var(--night-2) 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:64px var(--s5) calc(84px + env(safe-area-inset-bottom));
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,visibility .18s;
  }
  .tover.up{opacity:1;visibility:visible;pointer-events:auto;}
  .ttop{
    position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:0;right:0;
    display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
    padding:0 var(--s5);max-width:560px;margin:0 auto;
  }
  .tsession{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .autochip{
    display:flex;align-items:center;gap:7px;flex:none;cursor:pointer;
    background:var(--glass);border:1px solid var(--line);border-radius:var(--r-pill);padding:7px 12px;
    font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
  }
  .autochip .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);}
  .autochip[aria-checked="true"]{color:var(--green);border-color:rgba(143,170,131,.4);}
  .autochip[aria-checked="true"] .dot{background:var(--green);}
  .tload{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.05em;color:var(--gold);text-align:center;}
  .tload small{font-size:11px;color:var(--gold-dim);margin-left:2px;}
  .tset{font-size:clamp(23px,6.6vw,30px);font-weight:600;letter-spacing:-.02em;text-align:center;margin-top:var(--s1);line-height:1.15;max-width:16ch;}
  .tset em{font-style:normal;color:var(--dim);font-weight:500;}
  .tedge{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:center;margin-top:var(--s2);}
  .tphase{font-family:var(--mono);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);text-align:center;margin:var(--s6) 0 var(--s1);}
  .tover.rest .tphase{color:var(--green);}
  .tover.prep .tphase{color:var(--dim);}
  .tnum{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(88px,31vw,180px);font-weight:300;line-height:.9;letter-spacing:-.045em;color:var(--text);text-align:center;}
  .tover.prep .tnum{color:var(--muted);}
  .tprog{width:min(68vw,300px);height:3px;background:var(--line);margin-top:var(--s6);border-radius:2px;overflow:hidden;}
  .tprog i{display:block;height:100%;width:0;background:var(--gold);transition:width .1s linear;}
  .tover.rest .tprog i{background:var(--green);}
  @keyframes tpulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.07);opacity:.7;}}
  .tover.closing .tnum{color:var(--alarm);animation:tpulse .5s ease-in-out infinite;}
  .tover.closing .tphase{color:var(--alarm);}
  .tover.closing .tprog i{background:var(--alarm);}
  .tctrl{
    position:absolute;left:0;right:0;bottom:calc(var(--s5) + env(safe-area-inset-bottom));
    display:flex;gap:var(--s2);max-width:520px;margin:0 auto;padding:0 var(--s5);
  }
  .tctrl button{
    flex:1;cursor:pointer;background:var(--glass);border:1px solid var(--line);color:var(--muted);
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    padding:14px 5px;border-radius:var(--r-pill);
  }
  .tctrl button:hover{color:var(--text);}
  .tctrl button.pause{color:var(--text);border-color:var(--line-hi);}
  .tctrl button.stop:hover{color:var(--alarm);border-color:rgba(210,112,90,.4);}
  body.timing{overflow:hidden;}

  /* ---------- auto switch ---------- */
  .sw{
    display:flex;align-items:center;gap:var(--s3);flex:none;cursor:pointer;
    background:var(--inset);border:1px solid var(--line);border-radius:var(--r-pill);padding:0 var(--s4);
    font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
  }
  .sw .track{width:34px;height:19px;border-radius:var(--r-pill);background:var(--line-hi);position:relative;transition:background .16s ease;}
  .sw .track i{position:absolute;top:2.5px;left:2.5px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .16s ease,background .16s ease;}
  .sw[aria-checked="true"]{color:var(--green);border-color:rgba(143,170,131,.4);}
  .sw[aria-checked="true"] .track{background:rgba(143,170,131,.45);}
  .sw[aria-checked="true"] .track i{transform:translateX(15px);background:var(--green);}
  .sw:focus-visible,.autochip:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
    background:var(--gold);color:#1B1406;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.1em;text-transform:uppercase;padding:11px var(--s5);border-radius:var(--r-pill);
    opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:70;font-weight:700;
  }
  .toast.show{opacity:1;}


  /* ---------- day-panel header (selected route node) ---------- */
  .acc-h.day{align-items:flex-start;}
  .acc-n-wrap{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .acc-n-wrap .acc-n{white-space:normal;}
  .daystat{
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    display:inline-flex;align-items:center;gap:6px;
  }
  .daystat::before{content:"";width:6px;height:6px;border-radius:50%;display:block;flex:none;}
  .daystat.go{color:var(--green);}
  .daystat.go::before{background:var(--green);}
  .daystat.lock{color:var(--red);}
  .daystat.lock::before{background:var(--red);}
  .daystat.done{color:var(--dim);}
  .daystat.done::before{background:var(--dim);}

  .locked-note{
    margin-top:var(--s4);padding:var(--s4);border-radius:var(--r-field);
    background:var(--red-soft);border:1px solid rgba(226,69,47,.3);
    font-size:13px;line-height:1.55;color:var(--text);
  }
  .locked-note b{color:var(--red);}
  .past-log{
    margin-top:var(--s4);padding:var(--s4);border-radius:var(--r-field);
    background:var(--inset);border:1px solid var(--line);
  }
  .past-log .k{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-bottom:var(--s2);}
  .past-log .v{font-family:var(--mono);font-size:14px;color:var(--muted);}
  .past-log .note{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--muted);margin-top:var(--s2);}

  /* ---------- program switcher popup ---------- */
  .progswitch{position:fixed;inset:0;z-index:65;display:flex;align-items:flex-end;
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,visibility .18s;}
  .progswitch.up{opacity:1;visibility:visible;pointer-events:auto;}
  .progswitch-backdrop{position:absolute;inset:0;background:rgba(6,9,12,.62);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
  .progswitch-sheet{
    position:relative;z-index:1;width:100%;max-width:640px;margin:0 auto;
    background:linear-gradient(180deg,var(--sheet-top) 0%,var(--night) 220px);
    border:1px solid var(--line-hi);border-bottom:0;border-radius:26px 26px 0 0;
    padding:var(--s5) var(--s5) calc(var(--s6) + env(safe-area-inset-bottom));
    color:var(--text);   /* .progswitch sits outside #fb, so nothing here inherits
                             the app's text color unless set explicitly here */
    font-family:var(--sans);
  }
  .progswitch-head{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s4);
    font-size:17px;font-weight:600;
  }
  .progswitch-x{background:var(--glass);border:1px solid var(--line);border-radius:50%;
    width:32px;height:32px;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;}
  .pslot{
    display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
    padding:var(--s4);border-radius:var(--r-field);margin-bottom:var(--s2);
    background:var(--glass);border:1px solid var(--line);
  }
  .pslot.used{cursor:pointer;}
  .pslot.used:hover{border-color:var(--gold-dim);}
  .pslot.on{border-color:var(--gold);background:var(--glass-2);}
  .pslot.empty{opacity:.5;}
  .pslot-n{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pslot.empty .pslot-n{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--dim);}
  .pslot-c{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);flex:none;}
  .pslot.on .pslot-c{color:var(--gold);}

  @media (prefers-reduced-motion: reduce){
    #fb *,.tover,.tover *,.tabbar *{transition:none !important;}
    .tover.closing .tnum{animation:none !important;}
  }
  @media (max-width:400px){
    .specs{grid-template-columns:repeat(2,1fr);}
    .sheet{padding-left:var(--s3);padding-right:var(--s3);}
    .card-head,.acc-h,.acc-b,.fields,.actions{padding-left:var(--s4);padding-right:var(--s4);}
    .set,.startbar,.rest-note,.blockhead{padding-left:var(--s4);padding-right:var(--s4);}
    .tctrl button{letter-spacing:.06em;padding:14px 3px;}
  }

<script>
(function(){
"use strict";

/* ============================== storage ============================== */
const KEY = "fingerblock:v1";
async function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }
  catch(e){}
  return null;
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){ toast("Save failed — check private browsing is off"); }
  }, 250);
}

function save2(){ save(); }

/* ============================== program ============================== */
// Block work is unilateral: hands alternate, so ~60s between hands is ~2:20 of
// rest per hand. Every load is a % of your own tested max ON THAT SAME TOOL —
// a block number never sets a hang load, or the other way round.
//
// The low-intensity density thread runs the WHOLE block, not just the re-entry.
// Gilmore et al. (Sports Med Open, 2024, n=526 climbers) found frequent
// low-intensity finger loading raised strength about as much as max hangs, and
// that doing both was additive — roughly +2.5% and +3.2% alone, +5.8% together.
// So it stays in through the max-hang phases as a short finisher.
const SEC_BLOCK = 60, SEC_HANG = 120, SEC_TEST = 120, SEC_DEN = 30;

function blk(o){ return Object.assign(
  {mode:"block", edge:"20mm", grip:"Half crimp", restSec:SEC_BLOCK, label:"Working sets"}, o); }
function hng(o){ return Object.assign(
  {mode:"hang", edge:"20mm", grip:"Half crimp · two arms", restSec:SEC_HANG, label:"Max hangs"}, o); }
// the submax thread that keeps low-intensity loading alive once max work starts
function den(pct, sets){ return blk({label:"Density finisher", sets:sets||2, hold:30,
  restSec:SEC_DEN, load:{ref:"block20", pct:pct||0.45}}); }

function W(name, cue, blocks, kind){ return {name, cue, blocks, kind:kind||"work"}; }

const SESSIONS = [

  /* ================= PHASE 1 · re-entry & baseline ================= */
  W("Re-entry — density",
    "This should feel insultingly easy. That's the design — you're rebuilding tissue tolerance, not chasing a training effect. Long holds, low load, no ego.",
    [blk({sets:4, hold:20, load:{rpe:"5"}})]),

  W("Re-entry — density",
    "Same load as last session if it felt right; the longer hold is the only change. Loading like this is real strength work in its own right, not just a warm-up for the heavy weeks.",
    [blk({sets:4, hold:25, load:{rpe:"5–6"}})]),

  W("Test rehearsal",
    "Short and heavier — a dress rehearsal for Monday's test. Find the load that leaves about 2s in the tank. If anything felt tender or stiff this week, repeat session 2 instead and push the test back a session; two weeks off costs an experienced climber very little strength, but connective tissue lags behind it.",
    [blk({sets:5, hold:10, load:{rpe:"8"}})]),

  W("TEST — 20mm max",
    "Ramp 3 pulls per hand at roughly 50 / 70 / 85%, then add plates each attempt. Seven seconds is the test — stop when you can't hold 7s with a clean half crimp. Five loaded attempts per hand, maximum. The plates must break the floor or the number is fiction. Record both hands: more than 8% apart and the weaker side gets an extra set for the rest of the block.",
    [blk({sets:5, hold:7, restSec:SEC_BLOCK, label:"Ramped attempts"})], "test20"),

  /* ================= PHASE 2 · max block pulls ================= */
  W("Heavy — 20mm",
    "First load off the new baseline. A 7s max makes 8s working holds sit a little heavier than they would off a 10s max, so this opens at 80% rather than 85%. Leave about 3s in the tank — if you couldn't have held 11s, it's too heavy.",
    [blk({sets:5, hold:8, load:{ref:"block20", pct:0.80}})]),

  W("Density — 20mm",
    "Deliberately easy, and it is not filler. Frequent low-intensity loading builds strength on its own and stacks with the heavy days rather than just recovering from them. This thread runs all the way to week 8.",
    [blk({sets:3, hold:30, restSec:45, load:{ref:"block20", pct:0.45}})]),

  W("Small edge — 10mm calibration",
    "No 10mm baseline yet. Ramp to a 7s max, then 3 working sets at what you found. Expect roughly 50–65% of your 20mm number. Skin is the limiter on this edge, not strength — if your tips are thin or a joint feels tender, run this on 20mm at 90% and skip 10mm entirely. You lose almost nothing.",
    [blk({edge:"10mm", sets:3, hold:8, label:"Ramp, then work"})], "test10"),

  W("Heavy — 20mm",
    "Same shape, slightly heavier. Around 2–3s of margin.",
    [blk({sets:5, hold:8, load:{ref:"block20", pct:0.83}})]),

  W("Density — 20mm",
    "Still easy, still Wednesday, still not a hard day. If the heavy days are going well this is the session that lets them keep going well.",
    [blk({sets:3, hold:30, restSec:45, load:{ref:"block20", pct:0.45}})]),

  W("Small edge — 10mm",
    "The one loaded small-edge day of the block. Half crimp holds or the set doesn't count — watch for the index finger quietly unloading. Any doubt at all about skin or joints and this becomes 20mm at 90%.",
    [blk({edge:"10mm", sets:5, hold:8, load:{ref:"block10", pct:0.85}})]),

  W("Heavy — 20mm",
    "Fifth set added. Margin down to about 2s.",
    [blk({sets:6, hold:8, load:{ref:"block20", pct:0.86}})]),

  W("Density — 20mm",
    "Small bump, still comfortable. You should finish this able to boulder well.",
    [blk({sets:3, hold:30, restSec:45, load:{ref:"block20", pct:0.48}})]),

  W("Open hand — 20mm",
    "Three-finger drag or open hand, by feel at RPE 8 — no test needed, and none of your percentages apply here. It's the most tendon-friendly grip you have and it covers the slopers and rounded holds that half crimp misses. Skip it if the week has been heavy.",
    [blk({grip:"Open hand / drag", sets:5, hold:8, load:{rpe:"8"}})]),

  W("Heavy — 20mm",
    "Heaviest block-pull day of the program. 1–2s of margin. Full warm-up, no shortcuts, and stop the session if a finger starts doing something the others aren't.",
    [blk({sets:6, hold:8, load:{ref:"block20", pct:0.90}})]),

  W("Density — 20mm",
    "Last density-only session. From Monday the whole stimulus changes.",
    [blk({sets:3, hold:30, restSec:45, load:{ref:"block20", pct:0.48}})]),

  /* ================= PHASE 3 · deload & hang calibration ================= */
  W("Deload",
    "Three sets and walk away. Three weeks of near-max unilateral loading is behind you and you're about to change tools — this week is for consolidating, not proving anything.",
    [blk({sets:3, hold:8, load:{ref:"block20", pct:0.70}})]),

  W("TEST — two-arm max hang",
    "New tool, new baseline — a one-hand block number does not transfer to a two-arm hang. Ramp, then 10s hangs adding weight each set. Ten seconds here because your hang work is 10s: test the way you'll train. Stop at the first set you can't finish cleanly. Sort out the belt and plate logistics today, not in week 7.",
    [hng({sets:5, hold:10, restSec:SEC_TEST, label:"Ramped attempts"})], "testhang"),

  W("Max hangs — intro",
    "First real hang session — three sets to confirm Wednesday's number was honest, then the density finisher.",
    [hng({sets:3, hold:10, load:{ref:"hangTotal", pct:0.80}}), den(0.45, 2)]),

  /* ================= PHASE 4 · max hangs ================= */
  W("Max hangs",
    "Have the plates racked before you start — this is the tightest session in the program for time. The finisher is short and it's the main reason this block should outperform a hangs-only one.",
    [hng({sets:5, hold:10, load:{ref:"hangTotal", pct:0.85}}), den(0.45, 2)]),

  W("Block pulls — maintenance",
    "Keeps the unilateral work alive so any left/right gap doesn't quietly reopen while you're hanging two-handed.",
    [blk({sets:4, hold:8, load:{ref:"block20", pct:0.80}}), den(0.45, 2)]),

  W("Max hangs",

/* ============================== data model (v2) ==============================
   v1 stored one session per calendar date and a single overwritable max per tool.
   Neither survives what comes next: two programs can share a Monday, and a max
   you overwrite is a max you can't chart. So:

     S.log[]     append-only session events, each tagged with its program
     S.tests[]   append-only test results, each with the bodyweight and protocol
                 that produced it — those two are what make a number comparable
                 to one taken six months later
     S.maxes     NOT stored. Derived from S.tests on load, so it can never drift
                 out of step with the history behind it.
   ========================================================================== */
const PROGRAM = {
  id:"finger-block-8wk",
  name:"8-Week Finger Strength Block",
  days:[1,3,5]                       // Mon / Wed / Fri
};
const CUR = PROGRAM.id;

function PS(){                       // per-program state
  S.programs = S.programs || {};
  if(!S.programs[CUR]) S.programs[CUR] = {startDate:"2026-07-24", lastSkip:null, archived:false};
  return S.programs[CUR];
}
// session events for the current program, as a date-keyed view
function EN(){
  const o = {};
  (S.log||[]).forEach(e=>{ if(e.program===CUR) o[e.date] = e; });
  return o;
}
function putEntry(date, obj){
  S.log = (S.log||[]).filter(e=>!(e.program===CUR && e.date===date));
  S.log.push(Object.assign({date, program:CUR}, obj));
  S.log.sort((a,b)=> a.date<b.date ? -1 : a.date>b.date ? 1 : 0);
}
function dropEntry(date){
  S.log = (S.log||[]).filter(e=>!(e.program===CUR && e.date===date));
}
function draftKey(date){ return CUR+"|"+date; }

/* ---- tests ---- */
const TOOLS = [
  {id:"block20", label:"Block 20mm", hands:["L","R"], protocol:"7s half crimp"},
  {id:"block10", label:"Block 10mm", hands:["L","R"], protocol:"7s half crimp"},
  {id:"hang",    label:"Two-arm hang 20mm", hands:["both"], protocol:"10s half crimp"}
];
function toolOf(id){ return TOOLS.find(t=>t.id===id) || {id, label:id, hands:["L","R"], protocol:""}; }
function addTest(o){
  S.tests = S.tests || [];
  S.tests.push(Object.assign({
    id: "t"+Date.now()+Math.random().toString(36).slice(2,6),
    date: todayYmd(), program: CUR
  }, o));
  S.tests.sort((a,b)=> a.date<b.date ? -1 : a.date>b.date ? 1 : 0);
  refreshMaxes();
}
function testsFor(tool, hand){
  return (S.tests||[]).filter(t=>t.tool===tool && t.hand===hand)
    .sort((a,b)=> a.date<b.date ? -1 : a.date>b.date ? 1 : 0);
}
// S.maxes is a cache over S.tests — latest is current, first is baseline
function refreshMaxes(){
  const last = (tool,hand)=>{ const t=testsFor(tool,hand); return t.length ? t[t.length-1].load : null; };
  const first= (tool,hand)=>{ const t=testsFor(tool,hand); return t.length ? t[0].load : null; };
  S.maxes    = {block20L:last("block20","L"), block20R:last("block20","R"),
                block10L:last("block10","L"), block10R:last("block10","R"),
                hangTotal:last("hang","both")};
  S.baseline = {block20L:first("block20","L"), block20R:first("block20","R"),
                block10L:first("block10","L"), block10R:first("block10","R"),
                hangTotal:first("hang","both")};
}

/* ---- v1 -> v2 migration ---- */
function migrate(d){
  if(!d) return d;
  if(d.v === 3) return d;
  if(d.v === 2){                       // v2 -> v3: logs arrive, nothing is reshaped
    const o = Object.assign({}, d);
    o.v = 3;
    o.activities = o.activities && o.activities.length ? o.activities : defaultActivities();
    o.journal = o.journal || [];
    return o;
  }
  const o = Object.assign({}, d);
  o.v = 3;
  o.activities = defaultActivities();
  o.journal = [];
  o.programs = {};
  o.programs[CUR] = {startDate: d.startDate || "2026-07-24",
                     lastSkip: d.lastSkip || null, archived:false};
  o.log = [];
  Object.keys(d.entries || {}).sort().forEach(date=>{
    o.log.push(Object.assign({date, program:CUR}, d.entries[date]));
  });
  // v1 maxes carried no date. Attribute each to the day its test session was logged
  // where that can be worked out, otherwise to the first session on record.
  o.tests = [];
  const fallback = o.log.length ? o.log[0].date : (d.startDate || "2026-07-24");
  const dateOfIdx = i => { const e = o.log.find(x=>x.idx===i && x.status==="done"); return e ? e.date : fallback; };
  const m = d.maxes || {};
  const push = (tool,hand,load,date,proto)=>{
    if(load==null) return;
    o.tests.push({id:"m"+tool+hand, date, program:CUR, tool, hand, load,
                  bw:d.bodyweight||null, protocol:proto, note:"carried over from an earlier version"});
  };
  push("block20","L",m.block20L,dateOfIdx(3),"7s half crimp");
  push("block20","R",m.block20R,dateOfIdx(3),"7s half crimp");
  push("block10","L",m.block10L,dateOfIdx(6),"7s half crimp");
  push("block10","R",m.block10R,dateOfIdx(6),"7s half crimp");
  push("hang","both",m.hangTotal,dateOfIdx(16),"10s half crimp");
  o.tests.sort((a,b)=> a.date<b.date ? -1 : a.date>b.date ? 1 : 0);
  // drafts get namespaced by program from here on
  const nd = {};
  Object.keys(d.drafts || {}).forEach(k=>{ nd[CUR+"|"+k] = d.drafts[k]; });
  o.drafts = nd;
  delete o.entries; delete o.startDate; delete o.lastSkip;
  return o;
}

  log:[],       // append-only session events

/* ============================== dates ============================== */
function ymd(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function parseYmd(s){ const p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function todayYmd(){ return ymd(new Date()); }
function daysBetween(a,b){ return Math.round((parseYmd(b)-parseYmd(a))/86400000); }
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function pretty(s){ const d=parseYmd(s); return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]; }

// Mon/Wed/Fri slots from start date.
function slots(n){
  const out=[]; const d=parseYmd(PS().startDate);
  let guard=0;
  while(out.length<n && guard++<800){
    const w=d.getDay();
    if(w===1||w===3||w===5) out.push(ymd(d));
    d.setDate(d.getDate()+1);
  }
  return out;
}

/* ============================== pointers ============================== */
function doneCount(){
  return Object.values(EN()).filter(e=>e.status==="done" && e.advances!==false).length;
}
function nextSlot(){
  const list = slots(120);
  const en = EN();
  for(const s of list){ if(!en[s]) return s; }
  return list[list.length-1];
}
function lastDoneDate(){
  const ds = Object.keys(EN()).filter(d=>EN()[d].status==="done").sort();
  return ds.length ? ds[ds.length-1] : null;
}
function overdueSlots(){
  const t = todayYmd();
  const en = EN();
  return slots(120).filter(s=>!en[s] && daysBetween(s,t)>0);
}

// What to show for the next unlogged slot, plus any regression applied.
function currentPlan(){
  const date = nextSlot();
  const idx  = doneCount();
  const finished = idx >= SESSIONS.length;
  const ld = lastDoneDate();
  // Gap is measured from the last completed session to today (or the slot date, whichever is later).
  const ref = daysBetween(todayYmd(), date) > 0 ? date : todayYmd();
  const gap = ld ? daysBetween(ld, ref) : 0;

  let def = finished ? null : SESSIONS[idx];
  let mult = 1, note = null, advances = true;

  if(!finished && ld){
    if(gap >= 14 && idx > 0){
      def = REENTRY; mult = 1; advances = false;
      note = {kind:"warn", title:"Long layoff", body:
        "It's been <b>"+gap+" days</b> since your last session. You're getting a re-entry session instead of session "+(idx+1)+
        ". It won't advance the program — the next one picks up exactly where you left off, at 90%."};
    } else if(gap >= 7){
      mult = 0.90;
      note = {kind:"info", title:"Gap adjustment", body:
        "<b>"+gap+" days</b> since your last session. Loads below are already reduced to <b>90%</b> of prescription. Full load returns next session."};
    }
  }
  return {date, idx, def, mult, note, advances, finished, gap};
}

/* ============================== loads ============================== */
function unit(){ return S.units; }
const LB_PER_KG = 2.2046226218;
// Switching units converts every stored weight. The plate increment converts too —
// the plates on the floor don't change size just because the display does.
// Floating point can't round-trip cleanly, so we keep an exact snapshot of the
// values we converted away from and restore it if the switch is reversed.
function unitSnapshot(){
  const loads = {};
  Object.keys(EN()).forEach(d=>{
    const e = EN()[d];
    if(e && e.loads) loads[d] = {L:e.loads.L, R:e.loads.R};
  });
  return {units:S.units, bodyweight:S.bodyweight, tare:S.tare, increment:S.increment,
          tests:(S.tests||[]).map(t=>Object.assign({},t)), loads};
}
function applySnapshot(sn){
  S.bodyweight = sn.bodyweight; S.tare = sn.tare; S.increment = sn.increment;
  S.tests = (sn.tests||[]).map(t=>Object.assign({},t));
  Object.keys(sn.loads).forEach(d=>{
    if(EN()[d] && EN()[d].loads){
      EN()[d].loads.L = sn.loads[d].L;
      EN()[d].loads.R = sn.loads[d].R;
    }
  });
  S.units = sn.units;
  refreshMaxes();
}
function convertUnits(to){
  if(to === S.units) return;
  if(S.snap && S.snap.units === to){ applySnapshot(S.snap); S.snap = null; save(); return; }
  const snap = unitSnapshot();
  const f = (to === "lb") ? LB_PER_KG : 1/LB_PER_KG;
  const cv = v => (v==null || !isFinite(v)) ? v : Math.round(v*f*10000)/10000;
  S.bodyweight = cv(S.bodyweight);
  S.tare       = cv(S.tare);
  S.increment  = cv(S.increment);
  (S.tests||[]).forEach(t=>{ t.load = cv(t.load); if(t.bw!=null) t.bw = cv(t.bw);
                             if(t.added!=null) t.added = cv(t.added); });
  Object.keys(EN()).forEach(d=>{
    const e = EN()[d];
    if(e && e.loads){ e.loads.L = cv(e.loads.L); e.loads.R = cv(e.loads.R); }
  });
  S.units = to;
  S.snap = snap;
  refreshMaxes();
  save();
}

function roundInc(x){
  const i = Number(S.increment) || 2.5;
  return Math.round(x/i)*i;
}
function fmt(x){
  if(x===null||x===undefined||!isFinite(x)) return "—";
  const r = Math.round(x*100)/100;
  return (r%1===0) ? String(r) : r.toFixed(2).replace(/0$/,"");
}
// Load for ONE block of a session, already rounded to real plates.
function blockLoads(b, mult){
  const L = b.load;
  if(!L) return null;
  if(L.rpe) return {L:"RPE "+L.rpe, R:"RPE "+L.rpe, rpe:true};
  const m = S.maxes;
  if(L.ref==="hangTotal"){
    if(!m.hangTotal || !S.bodyweight) return {L:"set on test day", R:"set on test day", rpe:true};
    const total = m.hangTotal * L.pct * mult;
    const added = roundInc(total - S.bodyweight);
    return {L:fmt(added), R:fmt(added), added:true,
            sub:"added weight · total "+fmt(roundInc(total))+" "+unit()+" incl. bodyweight"};
  }
  const kl = L.ref+"L", kr = L.ref+"R";
  if(m[kl]==null || m[kr]==null) return {L:"set on test day", R:"set on test day", rpe:true};
  const l = roundInc(m[kl]*L.pct*mult), r = roundInc(m[kr]*L.pct*mult);
  const sub = Number(S.tare) > 0
    ? "plates to add: "+fmt(l-S.tare)+" / "+fmt(r-S.tare)+" "+unit()+" (hardware "+fmt(S.tare)+")"
    : null;
  return {L:fmt(l), R:fmt(r), sub};
}

/* ============================== charts ==============================
   Hand-rolled SVG: the app has to work with no network in a basement gym,
   so no chart library. Every chart reads S.tests or S.log, which means new
   data shows up automatically without touching this code.
   ================================================================== */
function chartEmpty(msg){
  return '<div class="chart-empty">'+msg+'</div>';
}
// series: [{name, color, pts:[{x:"YYYY-MM-DD", y:Number}]}]
function lineChart(series, opts){
  opts = opts || {};
  const pts = series.reduce((a,s)=>a.concat(s.pts), []);
  if(!pts.length) return chartEmpty(opts.empty || "No data yet.");
  const W = 320, H = 150, L = 38, R = 8, T = 12, B = 24;
  const xs = [...new Set(pts.map(p=>p.x))].sort();
  const ys = pts.map(p=>p.y);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if(opts.zero) lo = Math.min(0, lo);
  if(hi === lo){ hi = lo + (Math.abs(lo)*0.1 || 1); lo = lo - (Math.abs(lo)*0.1 || 1); }
  const pad = (hi-lo)*0.12; lo -= pad; hi += pad;
  const t0 = parseYmd(xs[0]).getTime(), t1 = parseYmd(xs[xs.length-1]).getTime();
  const X = d => L + (t1===t0 ? (W-L-R)/2 : (parseYmd(d).getTime()-t0)/(t1-t0)*(W-L-R));
  const Y = v => T + (1-(v-lo)/(hi-lo))*(H-T-B);

  let g = '';
  // horizontal guides
  for(let i=0;i<=3;i++){
    const v = lo + (hi-lo)*i/3, y = Y(v);
    g += '<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" '
       + 'stroke="var(--edge)" stroke-width="0.6" opacity=".7"/>'
       + '<text x="'+(L-5)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" class="ct">'
       + (opts.fmt ? opts.fmt(v) : (Math.round(v*10)/10))+'</text>';
  }
  series.forEach(s=>{
    if(!s.pts.length) return;
    const sorted = s.pts.slice().sort((a,b)=> a.x<b.x ? -1 : 1);
    if(sorted.length > 1){
      const d = sorted.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
      g += '<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2" '
         + 'stroke-linejoin="round" stroke-linecap="round"/>';
    }
    sorted.forEach(p=>{
      g += '<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3.2" fill="'+s.color+'"/>';
    });
  });
  // date labels: first and last only, so they never collide on a phone
  g += '<text x="'+L+'" y="'+(H-6)+'" class="ct">'+pretty(xs[0])+'</text>';
  if(xs.length>1)
    g += '<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" class="ct">'+pretty(xs[xs.length-1])+'</text>';

  const key = series.filter(s=>s.pts.length).map(s=>
    '<span><i style="background:'+s.color+'"></i>'+s.name+'</span>').join('');
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(opts.title||'chart')+'">'
       + g + '</svg><div class="chart-key">'+key+'</div></div>';
}

const C_OXIDE = "var(--oxide)", C_MOSS = "var(--moss)", C_INK = "var(--ink)", C_FAINT = "var(--faint)";

// 1 — strength over time, as strength:weight where bodyweight is known
function chartMaxes(){
  const mk = (tool, hand, name, color) => ({
    name, color,
    pts: testsFor(tool, hand).filter(t=>t.bw).map(t=>({x:t.date, y: t.load/t.bw}))
  });
  const s = [
    mk("block20","L","20mm L",C_OXIDE),
    mk("block20","R","20mm R",C_MOSS),
    mk("block10","L","10mm L",C_INK),
    mk("block10","R","10mm R",C_FAINT),
    {name:"Two-arm hang", color:"#7A6A97",
     pts: testsFor("hang","both").filter(t=>t.bw).map(t=>({x:t.date, y:t.load/t.bw}))}
  ].filter(x=>x.pts.length);
  return lineChart(s, {title:"Strength to weight over time", fmt:v=>v.toFixed(2)+"x",
    empty:"Your first test is session 4. Once it's logged, this charts strength as a multiple of bodyweight — which is the number that stays honest when your weight moves."});
}
// 2 — is the left/right gap closing?
function chartAsym(){
  const mk = (tool,name,color)=>{
    const L = testsFor(tool,"L"), R = testsFor(tool,"R");
    const byDate = {};
    L.forEach(t=>{ byDate[t.date] = byDate[t.date]||{}; byDate[t.date].L = t.load; });
    R.forEach(t=>{ byDate[t.date] = byDate[t.date]||{}; byDate[t.date].R = t.load; });
    return {name, color, pts: Object.keys(byDate).sort()
      .filter(d=>byDate[d].L!=null && byDate[d].R!=null)
      .map(d=>({x:d, y: Math.abs(byDate[d].L-byDate[d].R)/Math.max(byDate[d].L,byDate[d].R)*100}))};
  };
  const s = [mk("block20","20mm",C_OXIDE), mk("block10","10mm",C_INK)].filter(x=>x.pts.length);
  return lineChart(s, {title:"Left/right asymmetry", zero:true, fmt:v=>Math.round(v)+"%",
    empty:"Needs two tests on the same tool. Anything above 8% is worth an extra set on the weaker side — this shows whether the gap is closing."});
}
// 3 — the early-warning chart: effort creeping up while load holds steady
function chartRPE(){
  const pts = (S.log||[]).filter(e=>e.program===CUR && e.status==="done" && e.rpe!=null)
    .map(e=>({x:e.date, y:e.rpe}));
  return lineChart([{name:"Session RPE", color:C_OXIDE, pts}], {
    title:"Session RPE over time", fmt:v=>v.toFixed(1),
    empty:"Logged automatically from the RPE box. Watch for it drifting up while your loads stay flat — that's fatigue accumulating, and it's the earliest signal to back off."});
}
// 4 — are you actually hitting the prescribed number?
function chartAdherence(){
  const pts = [];
  (S.log||[]).filter(e=>e.program===CUR && e.status==="done" && e.loads).forEach(e=>{
    const def = SESSIONS[e.idx]; if(!def) return;
    const b = (def.blocks||[])[0]; if(!b || !b.load || b.load.rpe) return;
    const m = S.maxes, ref = b.load.ref;
    if(ref === "hangTotal") return;
    const pL = m[ref+"L"]!=null ? m[ref+"L"]*b.load.pct : null;
    const pR = m[ref+"R"]!=null ? m[ref+"R"]*b.load.pct : null;
    const act = [e.loads.L, e.loads.R].filter(v=>v!=null);
    const pre = [pL, pR].filter(v=>v!=null);
    if(!act.length || !pre.length) return;
    const a = act.reduce((x,y)=>x+y,0)/act.length, p = pre.reduce((x,y)=>x+y,0)/pre.length;
    pts.push({x:e.date, y: a/p*100});
  });
  return lineChart([{name:"Actual vs prescribed", color:C_MOSS, pts}], {
    title:"Actual load vs prescribed", fmt:v=>Math.round(v)+"%",
    empty:"Appears once you're on percentage-based sessions and record the load you actually used. Consistently under 100% means the prescription is too heavy; consistently over means your max is stale."});
}

/* ============================== logs ==============================
   An activity owns a list of typed fields; an entry holds values for them.
   Fields are typed objects rather than free text because that is what keeps
   the analysis question open — a number with a unit can be charted later,
   a string never can. Grades stay on their own scale and are never converted.
   ================================================================ */
const FIELD_TYPES = [
  {id:"number",   label:"Number"},
  {id:"duration", label:"Duration (min)"},
  {id:"rating",   label:"Rating 1–10"},
  {id:"select",   label:"Pick from a list"},
  {id:"grade",    label:"Climbing grade"},
  {id:"check",    label:"Yes / no"},
  {id:"text",     label:"Short text"}
];

// kept deliberately separate — V7→V8 is not the same step as V4→V5, and the
// V/Font mapping is contested, so nothing here is converted behind your back
const SCALES = {
  V:    ["VB","V0","V1","V2","V3","V4","V5","V6","V7","V8","V9","V10","V11","V12","V13","V14","V15","V16","V17"],
  Font: ["3","4","5","5+","6A","6A+","6B","6B+","6C","6C+","7A","7A+","7B","7B+","7C","7C+","8A","8A+","8B","8B+","8C","8C+","9A"]
};
function gradeIndex(scale, g){ const a = SCALES[scale]||[]; return a.indexOf(g); }

// offered when you build an activity — pick what fits, add your own, or ignore
const PRESET_FIELDS = [
  {id:"duration",  label:"Duration",        type:"duration"},
  {id:"rpe",       label:"RPE",             type:"rating"},
  {id:"felt",      label:"How it felt",     type:"rating"},
  {id:"volume",    label:"Problems tried",  type:"number"},
  {id:"sends",     label:"Sends",           type:"number"},
  {id:"hardest",   label:"Hardest grade",   type:"grade"},
  {id:"angle",     label:"Board angle",     type:"number", unit:"°"},
  {id:"load",      label:"Load",            type:"number", unit:"lb"},
  {id:"sets",      label:"Sets",            type:"number"},
  {id:"reps",      label:"Reps",            type:"number"},
  {id:"distance",  label:"Distance",        type:"number", unit:"km"},
  {id:"skin",      label:"Skin",            type:"select", options:["good","thin","split"]},
  {id:"where",     label:"Where",           type:"select", options:["gym","board","outdoor"]}
];

function uid(p){ return (p||"x") + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

function defaultActivities(){

function activityById(id){ return (S.activities||[]).find(a=>a.id===id); }
function entriesFor(actId, date){
  return (S.journal||[])
    .filter(e=>e.activityId===actId && (!date || e.date===date))
    .sort((a,b)=> a.date<b.date ? 1 : a.date>b.date ? -1 : (b.ts||0)-(a.ts||0));
}

/* ---- rendering one field's input ---- */
function fieldInput(f, val, idp){
  const id = idp+"_"+f.id;
  const v = (val==null ? "" : val);
  if(f.type==="select"){
    return '<select id="'+id+'"><option value="">—</option>'
      + (f.options||[]).map(o=>'<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>').join("")
      + '</select>';
  }
  if(f.type==="check"){
    return '<label class="chk" style="border:0;padding:4px 0"><input type="checkbox" id="'+id+'"'
      + (v===true?' checked':'')+'> yes</label>';
  }
  if(f.type==="grade"){
    const sc = (v && v.scale) || "V", g = (v && v.grade) || "";
    return '<div class="gradepick">'
      + '<select id="'+id+'_s" class="gs">'
      +   Object.keys(SCALES).map(k=>'<option'+(k===sc?' selected':'')+'>'+k+'</option>').join("")
      + '</select>'
      + '<select id="'+id+'_g">'+'<option value="">—</option>'
      +   (SCALES[sc]||[]).map(x=>'<option'+(x===g?' selected':'')+'>'+esc(x)+'</option>').join("")
      + '</select></div>';
  }
  if(f.type==="rating")
    return '<input type="number" min="1" max="10" step="0.5" id="'+id+'" value="'+v+'" placeholder="1–10">';
  if(f.type==="duration")
    return '<input type="number" min="0" step="1" id="'+id+'" value="'+v+'" placeholder="minutes">';
  if(f.type==="number")
    return '<input type="number" step="any" id="'+id+'" value="'+v+'" placeholder="'+(f.unit||"")+'">';
  return '<input type="text" id="'+id+'" value="'+esc(String(v))+'">';
}
function readField(f, idp){
  const id = idp+"_"+f.id, el = $(id);
  if(f.type==="grade"){
    const s = $(id+"_s"), g = $(id+"_g");
    if(!g || !g.value) return null;
    return {scale:s.value, grade:g.value};
  }
  if(!el) return null;
  if(f.type==="check") return el.checked ? true : null;
  if(f.type==="text")  return el.value.trim() || null;
  const n = parseFloat(el.value);
  return isFinite(n) ? n : null;
}
function fieldText(f, v){
  if(v==null || v==="") return null;
  if(f.type==="grade")    return v.grade + " (" + v.scale + ")";
  if(f.type==="check")    return "yes";
  if(f.type==="duration") return v + " min";
  if(f.type==="rating")   return v + "/10";
  if(f.type==="number")   return v + (f.unit ? " "+f.unit : "");
  return String(v);
}

/* ---- the entry form: today by default, any date if you're catching up ---- */
function entryForm(act, entry){
  const idp = "lg_"+act.id;
  const e = entry || {date:todayYmd(), values:{}, problems:[], notes:""};
  let h = '<div class="entryform" data-act="'+act.id+'">';
  h += '<div class="fld"><label>Date</label><input type="date" id="'+idp+'_date" value="'+e.date+'"></div>';
  act.fields.forEach(f=>{
    h += '<div class="fld"><label>'+esc(f.label)+(f.unit?' ('+esc(f.unit)+')':'')+'</label>'
      +  fieldInput(f, e.values[f.id], idp)+'</div>';
  });
  if(act.climbs){
    h += '<div class="probs" id="'+idp+'_probs">'
      +  '<div class="probs-h">Problems <span>optional — the summary above is enough on its own</span></div>';
    (e.problems||[]).forEach((p,i)=>{ h += problemRow(idp, i, p); });
    h += '</div>'
      +  '<button class="btn ghost sm" id="'+idp+'_addprob">+ Add problem</button>';
  }
  h += '<div class="fld"><label>Notes</label><textarea id="'+idp+'_notes" rows="2">'+esc(e.notes||"")+'</textarea></div>';
  h += '<div class="entryact">'
    +  '<button class="btn primary" id="'+idp+'_save">'+(entry?"Update entry":"Save entry")+'</button>'
    +  (entry ? '<button class="btn ghost" id="'+idp+'_cancel">Cancel</button>' : '')
    +  '</div></div>';
  return h;
}
function problemRow(idp, i, p){
  p = p || {scale:"V", grade:"", attempts:null, sent:false, note:""};
  return '<div class="prow" data-i="'+i+'">'
    + '<select class="p-scale">'+Object.keys(SCALES).map(k=>'<option'+(k===p.scale?' selected':'')+'>'+k+'</option>').join("")+'</select>'
    + '<select class="p-grade">'+'<option value="">grade</option>'
    +   (SCALES[p.scale]||[]).map(x=>'<option'+(x===p.grade?' selected':'')+'>'+esc(x)+'</option>').join("")+'</select>'
    + '<input type="number" class="p-att" min="1" step="1" placeholder="try" value="'+(p.attempts==null?"":p.attempts)+'">'
    + '<label class="p-sent"><input type="checkbox"'+(p.sent?' checked':'')+'> sent</label>'
    + '<button class="p-x" aria-label="Remove">×</button>'
    + '</div>';
}
function readProblems(idp){
  const box = $(idp+"_probs");
  if(!box) return [];
  return [...box.querySelectorAll(".prow")].map(r=>({
    scale:   r.querySelector(".p-scale").value,
    grade:   r.querySelector(".p-grade").value,
    attempts:parseInt(r.querySelector(".p-att").value,10) || null,
    sent:    r.querySelector(".p-sent input").checked,
  })).filter(p=>p.grade);
}

/* ---- the Logs tab ---- */
function renderLogs(){
  let h = '';
  if(!S.activities.length){
    h += '<div class="empty">No activities yet. Add one to start logging.</div>';
  }
  S.activities.forEach(act=>{
    const open = !!openAcc["log:"+act.id];
    const today = entriesFor(act.id, todayYmd()).length;
    const all   = entriesFor(act.id).length;
    h += '<div class="acc'+(open?' open':'')+'">'
      +  '<button class="acc-h" data-acc="log:'+act.id+'">'
      +    '<span class="acc-n">'+esc(act.name)+'</span>'
      +    '<span class="acc-m">'+(today ? today+" today · " : "")+all+' logged</span>'
      +    '<span class="acc-c">'+(open?"−":"+")+'</span>'
      +  '</button>';
    if(open){
      h += '<div class="acc-b">';
      const editing = editEntry && editEntry.activityId===act.id ? editEntry : null;
      h += entryForm(act, editing);
      const past = entriesFor(act.id);
      if(past.length){
        h += '<div class="loghist"><h4>History</h4>';
        past.slice(0,40).forEach(e=>{
          const bits = act.fields.map(f=>{
            const t = fieldText(f, e.values[f.id]);
            return t ? '<b>'+esc(f.label)+'</b> '+esc(t) : null;
          }).filter(Boolean);
          const np = (e.problems||[]).length;
          h += '<div class="logrow" data-e="'+e.id+'">'
            +   '<div class="logrow-d">'+pretty(e.date)+'</div>'
            +   '<div class="logrow-v">'+(bits.join(" · ")||"—")
            +     (np?'<em>'+np+' problem'+(np===1?'':'s')+' logged</em>':'')
            +     (e.notes?'<em class="n">'+esc(e.notes)+'</em>':'')+'</div>'
            +   '<div class="logrow-a">'
            +     '<button class="lg-edit" data-e="'+e.id+'">edit</button>'
            +     '<button class="lg-del" data-e="'+e.id+'">×</button>'
            +   '</div></div>';
        });
        h += '</div>';
      }
      h += '<button class="btn ghost sm" id="edit_'+act.id+'">Edit fields</button>';
      h += '</div>';
    }
    h += '</div>';
  });
  h += '<div class="up"><button class="btn" id="lg-newact">+ New activity</button></div>';
  return h;
}

/* ---- logs: wiring ---- */
let openAcc = {};      // which accordion sections are open (not persisted)
let editEntry = null;  // the entry currently loaded into a form for editing

function wireAccordions(){
  document.querySelectorAll("#fb .acc-h").forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.acc;
      openAcc[k] = !openAcc[k];
      if(!openAcc[k] && editEntry) editEntry = null;
      render();
    };
  });
}

function wireLogs(){
  (S.activities||[]).forEach(act=>{
    const idp = "lg_"+act.id;
    const add = $(idp+"_addprob");
    if(add) add.onclick = ()=>{
      const box = $(idp+"_probs");
      const i = box.querySelectorAll(".prow").length;
      box.insertAdjacentHTML("beforeend", problemRow(idp, i, null));
      wireProblemRows();
    };
    const save = $(idp+"_save");
    if(save) save.onclick = ()=>{
      const vals = {};
      act.fields.forEach(f=>{ const v = readField(f, idp); if(v!=null) vals[f.id] = v; });
      const notes = ($(idp+"_notes").value || "").trim();
      const probs = act.climbs ? readProblems(idp) : [];
      const date  = $(idp+"_date").value || todayYmd();
      if(!Object.keys(vals).length && !notes && !probs.length){
        toast("Nothing to save yet"); return;
      }
      S.journal = S.journal || [];
      if(editEntry){
        const t = S.journal.find(x=>x.id===editEntry.id);
        if(t){ t.date=date; t.values=vals; t.problems=probs; t.notes=notes; }
        editEntry = null;
        toast("Entry updated");
      }else{
        S.journal.push({id:uid("e"), activityId:act.id, date, values:vals,
                        problems:probs, notes, ts:Date.now()});
        toast("Logged");
      }
      save2(); render();
    };
    const cancel = $(idp+"_cancel");
    if(cancel) cancel.onclick = ()=>{ editEntry = null; render(); };
    const ed = $("edit_"+act.id);
    if(ed) ed.onclick = ()=>{ openActEditor(act.id); };
  });

  document.querySelectorAll("#fb .lg-edit").forEach(b=>{
    b.onclick = ()=>{
      editEntry = (S.journal||[]).find(x=>x.id===b.dataset.e) || null;
      render();
    };
  });
  document.querySelectorAll("#fb .lg-del").forEach(b=>{
    b.onclick = ()=>{
      const e = (S.journal||[]).find(x=>x.id===b.dataset.e);
      if(!e) return;
      if(!confirm("Delete the "+pretty(e.date)+" entry? This can't be undone.")) return;
      S.journal = S.journal.filter(x=>x.id!==b.dataset.e);
      if(editEntry && editEntry.id===b.dataset.e) editEntry = null;
      save2(); render(); toast("Deleted");
    };
  });
  const na = $("lg-newact");
  if(na) na.onclick = ()=>{ openActEditor(null); };
  wireProblemRows();
}

function wireProblemRows(){
  document.querySelectorAll("#fb .prow").forEach(r=>{
    const sc = r.querySelector(".p-scale"), gr = r.querySelector(".p-grade");
    sc.onchange = ()=>{
      const cur = gr.value;
      gr.innerHTML = '<option value="">grade</option>'
        + SCALES[sc.value].map(x=>'<option'+(x===cur?' selected':'')+'>'+x+'</option>').join("");
    };
    r.querySelector(".p-x").onclick = ()=>{ r.remove(); };
  });
  // grade fields on the main form switch their own option list too
  document.querySelectorAll("#fb .gradepick .gs").forEach(s=>{
    s.onchange = ()=>{
      const g = s.parentNode.querySelector("select:not(.gs)");
      const cur = g.value;
      g.innerHTML = '<option value="">—</option>'
        + SCALES[s.value].map(x=>'<option'+(x===cur?' selected':'')+'>'+x+'</option>').join("");
    };
  });
}

let actEdit = null;
function openActEditor(id){

              : {id:uid("act"), name:"", climbs:false, created:todayYmd(), fields:[]};
  actEdit._isNew = !a;

}
function renderActEditor(){
  const a = actEdit;
  let h = '<div class="banner"><span class="eyebrow">'+(a._isNew?"New activity":"Edit activity")+'</span>'
        + 'Fields are typed so they stay usable later — a number with a unit can be charted, free text can\'t.</div>';
  h += '<div class="card"><div class="fields">';
  h += '<div class="fld"><label>Activity name</label><input id="ae_name" value="'+esc(a.name)+'" placeholder="e.g. Board climbing"></div>';
  h += '<label class="chk"><input type="checkbox" id="ae_climbs"'+(a.climbs?" checked":"")+'> Log individual problems as well as a summary</label>';
  h += '</div>';

  if(!a.fields.length) h += '<div class="empty" style="padding:4px 0">No fields yet — add from the presets below, or make your own.</div>';
  a.fields.forEach((f,i)=>{
    h += '<div class="fieldrow"><span class="fr-l">'+esc(f.label)+'</span>'
      +  '<span class="fr-t">'+(FIELD_TYPES.find(t=>t.id===f.type)||{}).label+'</span>'
      +  '<button class="fr-x" data-i="'+i+'">×</button></div>';
  });
  h += '</div>';
  h += '<div class="fields" style="border-top:1px solid var(--rule)">'
    +  '<label style="font-family:var(--mono);font-size:9px;letter-spacing:0.19em;text-transform:uppercase;color:var(--pencil)">Add a preset</label>'
    +  '<div class="presets">'
    +  PRESET_FIELDS.filter(p=>!a.fields.some(f=>f.id===p.id))
         .map(p=>'<button class="pchip" data-p="'+p.id+'">'+esc(p.label)+'</button>').join("")
    +  '</div></div>';
  h += '<div class="fields" style="border-top:1px solid var(--rule)">'
    +  '<label style="font-family:var(--mono);font-size:9px;letter-spacing:0.19em;text-transform:uppercase;color:var(--pencil)">Or make your own</label>'
    +  '<div class="duo"><div class="fld"><input id="ae_flabel" placeholder="Field name"></div>'
    +  '<div class="fld"><select id="ae_ftype">'+FIELD_TYPES.map(t=>'<option value="'+t.id+'">'+t.label+'</option>').join("")+'</select></div></div>'
    +  '<div class="duo"><div class="fld"><input id="ae_funit" placeholder="Unit (optional)"></div>'
    +  '<div class="fld"><input id="ae_fopts" placeholder="List options, comma separated"></div></div>'
    +  '<button class="btn sm" id="ae_addfield">Add field</button></div>';
  h += '<div class="actions">'
    +  '<button class="btn primary" id="ae_save">Save activity</button>'
    +  '<button class="btn ghost" id="ae_cancel">Cancel</button></div>';
  if(!a._isNew) h += '<div class="fields" style="border-top:1px solid var(--rule)">'
    +  '<button class="btn ghost" id="ae_del">Delete this activity and its entries</button></div>';
  h += '</div>';
  return h;
}
function wireActEditor(){
  const a = actEdit;
  document.querySelectorAll("#fb .pchip").forEach(b=>{
    b.onclick = ()=>{
      const p = PRESET_FIELDS.find(x=>x.id===b.dataset.p);
      if(p) a.fields.push(JSON.parse(JSON.stringify(p)));
      a.name = $("ae_name").value; a.climbs = $("ae_climbs").checked;
      render();
    };
  });
  document.querySelectorAll("#fb .fr-x").forEach(b=>{
    b.onclick = ()=>{
      a.fields.splice(+b.dataset.i,1);
      a.name = $("ae_name").value; a.climbs = $("ae_climbs").checked;
      render();
    };
  });
  const af = $("ae_addfield");
  if(af) af.onclick = ()=>{
    const label = ($("ae_flabel").value||"").trim();
    if(!label){ toast("Give the field a name"); return; }
    const type = $("ae_ftype").value;
    const unit = ($("ae_funit").value||"").trim();
    const opts = ($("ae_fopts").value||"").split(",").map(x=>x.trim()).filter(Boolean);
    const f = {id:uid("f"), label, type};
    if(unit) f.unit = unit;
    if(type==="select") f.options = opts.length ? opts : ["yes","no"];
    a.fields.push(f);
    a.name = $("ae_name").value; a.climbs = $("ae_climbs").checked;
    render();
  };
  const sv = $("ae_save");
  if(sv) sv.onclick = ()=>{
    a.name = ($("ae_name").value||"").trim();
    a.climbs = $("ae_climbs").checked;
    if(!a.name){ toast("Give the activity a name"); return; }
    S.activities = S.activities || [];
    const i = S.activities.findIndex(x=>x.id===a.id);
    const clean = JSON.parse(JSON.stringify(a)); delete clean._isNew;
    if(i>=0) S.activities[i] = clean; else S.activities.push(clean);
    openAcc["log:"+a.id] = true;
    actEdit = null; save2(); render(); toast("Saved");
  };
  const cx = $("ae_cancel");
  if(cx) cx.onclick = ()=>{ actEdit = null; render(); };
  const dl = $("ae_del");
  if(dl) dl.onclick = ()=>{
    const n = entriesFor(a.id).length;
    if(!confirm("Delete " + a.name + " and its " + n + " entr" + (n===1?"y":"ies") + "? This can't be undone.")) return;
    S.activities = (S.activities||[]).filter(x=>x.id!==a.id);
    S.journal    = (S.journal||[]).filter(x=>x.activityId!==a.id);
    actEdit = null; save2(); render(); toast("Deleted");
  };
}

/* ---- Programs tab: one accordion per program, ready for more than one ---- */
function renderDayHeaderStatus(idx){
  const done = doneCount();
  const sched = sessionSchedule()[idx] || {};
  const dateTxt = sched.date ? pretty(sched.date) : "—";
  if(idx===done)  return '<div class="daystat go">Next upcoming · '+dateTxt+'</div>';
  if(idx>done)    return '<div class="daystat lock">Scheduled · '+dateTxt+'</div>';
  return '<div class="daystat done">Completed · '+dateTxt+'</div>';
}

function renderDayBody(idx){
  const done = doneCount();
  if(idx===done) return renderToday();

  const def = SESSIONS[idx];
  const sc = sessionSchedule()[idx] || {};

  if(idx > done){
    const next = SESSIONS[done];
    return '<div class="card"><div class="card-head">'
      +     '<div class="row1"><h2>'+def.name+'</h2></div>'
      +     specLine(def)
      +     '<div class="cue">'+def.cue+'</div>'
      +   '</div>'
      +   '<div class="fields"><div class="locked-note">'
      +     '<b>Not yet.</b> Complete or skip <b>'+esc(next.name)+'</b> (session '+(done+1)+') first — '
      +     'this program runs in order.'
      +   '</div></div></div>';
  }

  const e = (sc.entry) || {};
  const bits = [];
  if(e.loads && (e.loads.L!=null || e.loads.R!=null))
    bits.push('L '+fmt(e.loads.L)+' / R '+fmt(e.loads.R)+' '+unit());
  if(e.rpe!=null) bits.push('RPE '+e.rpe);
  return '<div class="card"><div class="card-head">'
    +     '<div class="row1"><h2>'+def.name+'</h2></div>'
    +     specLine(def)
    +     '<div class="cue">'+def.cue+'</div>'
    +   '</div>'
    +   '<div class="fields"><div class="past-log">'
    +     '<div class="k">Logged '+(sc.date?pretty(sc.date):"")+'</div>'
    +     (bits.length ? '<div class="v">'+bits.join(' · ')+'</div>' : '')
    +     (e.notes ? '<div class="note">'+esc(e.notes)+'</div>' : '')
    +   '</div></div></div>';

const $ = id=>document.getElementById(id);

function toast(msg){
